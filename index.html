    // ============ TAB運指プランナー（ボックスポジション最適化） ============
    // ・ボックス = 連続5フレット（b 〜 b+4）。フレーズの塊は必ず1つのボックス内に収める
    // ・ボックス移動（ポジションチェンジ）は動的計画法で最小回数・最短距離にし、
    //   「長い音や休符のあと」「同じ弦での1〜2フレットのスライド」「音型の進行方向と同じ向き」で行うよう誘導する
    const TAB_BOX_SPAN = 3;       // 基本ボックス = b..b+3 の4フレット（1フレット1指）。5フレット目以降は「寄り道」扱い
    const TAB_MAX_BOX = MAX_FRET - TAB_BOX_SPAN; // 19（19〜22Fのボックスまで）
    const POSITION_ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX"];

    const tabTransitionCost = (p, c, gap) => {
      let cost = 0;
      const sd = Math.abs(p.stringIdx - c.stringIdx);
      if (sd > 1) cost += (sd - 1) * 4;                              // 弦飛びは控えめに
      if (p.midi === c.midi && (p.stringIdx !== c.stringIdx || p.fretNum !== c.fretNum)) cost += 6; // 同音連打は同じ場所で
      const bothPos = !!(p.posKey && c.posKey);
      const moved = bothPos ? p.posKey !== c.posKey : p.box !== c.box;
      if (moved && bothPos && p.par && c.par && (p.par.fam !== c.par.fam || p.par.root !== c.par.root) && Math.abs(c.box - p.box) <= 1) {
        cost += 1.2;                                                  // コードが変わってスケールが変わっただけ（手の位置はほぼ同じ）
      } else if (moved) {
        const d = Math.abs(c.box - p.box);
        let sc = 10 + d * 1.0;                                        // ポジション移動の基本コスト（距離に比例）
        if (gap >= 1) sc -= 3;                                       // 長い音・休符のあとは移動しやすい
        else if (gap < 0.45) sc += 2.5;                              // 16分・3連の途中では移動しない
        if (p.free || c.free) sc -= 2;                               // 開放弦・ハーモニクスの間は移動しやすい
        else {
          const pitchDir = Math.sign(c.midi - p.midi), boxDir = Math.sign(c.box - p.box);
          if (p.stringIdx === c.stringIdx && Math.abs(c.fretNum - p.fretNum) <= 2 && pitchDir === boxDir && !p.out && !c.out) {
            sc -= 2;                         // 同じ弦で1〜2フレット滑らせてボックスを連結（最もスムーズ）
          }
          if (pitchDir !== 0 && pitchDir !== boxDir) sc += 3;        // 音型の進行方向と逆向きの移動は避ける
          sc += Math.max(0, Math.abs(c.fretNum - p.fretNum) - 2) * 0.6; // 移動時も左手の実際の移動量は小さく
        }
        cost += Math.max(1.5, sc);
      } else if (!p.free && !c.free) {
        cost += Math.abs(c.fretNum - p.fretNum) * 0.15;
        if (p.out && c.out) cost += 3;                               // 寄り道が続くならボックスごと移動する
      }
      return cost;
    };

    // notes: [{midi, isHarm, beatPos}]  carry: 直前の小節の最後の状態（なければnull）  getForce: 強制弦（メカニカル用）
    const planMeasureTab = (ownNotes, carry, absBeatBase, getForce, lookahead = []) => {
      if (ownNotes.length === 0) return { tabs: [], cost: 0, last: carry };
      const notes = ownNotes.concat(lookahead); // 次の小節も見越して最適化し、確定するのは自分の小節だけ
      const layers = notes.map((n, idx) => {
        const force = getForce ? getForce(n, idx) : -1;
        const cands = [];
        if (n.isHarm) {
          let matches = NATURAL_HARMONICS.filter(h => h.midi === n.midi);
          if (matches.length === 0) matches = NATURAL_HARMONICS.filter(h => h.pc === (n.midi % 12));
          matches.forEach(h => cands.push({ stringIdx: h.stringIdx, fret: h.fret, fretNum: h.fretNum, free: true, base: Math.abs(h.midi - n.midi) * 2 }));
        }
        if (cands.length === 0) {
          const fretted = [];
          let open = null;
          for (let s = 0; s < NUM_STRINGS; s++) {
            const fret = n.midi - BASS_STRINGS[s];
            if (fret < 0 || fret > MAX_FRET) continue;
            let base = 0;
            // 普段使う2F〜17Fを中心に。範囲外（1F・18F〜22F）は必要なときだけ
            base += Math.max(0, 2 - fret) * 1.5;
            base += Math.max(0, fret - 17) * 2.5;
            // 6弦・1弦の端は少しだけ控えめに（単音ラインは中の弦が弾きやすい）
            if (s === 0) base += 0.3;
            if (force !== -1 && s !== force) base += 12;
            // 和音のメロディ音は、下に和音の音を置ける弦（下に弦が残る位置）にする
            if (n.chordExtra && n.chordExtra.length && s < n.chordExtra.length) base += 30;
            if (fret === 0) open = { stringIdx: s, fret: "0", fretNum: 0, free: true, base };
            else fretted.push({ stringIdx: s, fret: String(fret), fretNum: fret, free: false, base });
          }
          // 開放弦は他に押さえられる場所がない音（E1）のときだけ使う
          if (fretted.length > 0) cands.push(...fretted); else if (open) cands.push(open);
        }
        if (cands.length === 0) cands.push({ stringIdx: 0, fret: "0", fretNum: 0, free: true, base: 50 });
        const states = [];
        // 7ポジション：親スケールが分かる音は、そのスケールの7つのポジションの中で置く
        if (n.parent && !n.isHarm && force === -1) {
          sevenPositions(n.parent).forEach(pos => cands.forEach(c => {
            if (c.free) return;
            let node = c.base, out = false;
            if (pos.set.has(c.stringIdx + ":" + c.fretNum)) { /* ポジションの形の中 */ }
            else if (c.fretNum >= pos.min && c.fretNum <= pos.max) node += 3;           // 形の外だが同じ手の範囲（半音のアプローチなど）
            else {
              const dist = c.fretNum < pos.min ? pos.min - c.fretNum : c.fretNum - pos.max;
              if (dist > 4) return;
              node += 8 + dist * 1.5; out = true;                                       // 一時的な寄り道
            }
            states.push({ ...c, box: pos.min, posKey: pos.key, posName: pos.name, posFull: pos.full, par: pos.par, out, midi: n.midi, node, absBeat: absBeatBase + n.beatPos });
          }));
        }
        if (states.length === 0) cands.forEach(c => {
          for (let b = 1; b <= TAB_MAX_BOX; b++) {
            let node = c.base;
            let out = false;
            if (!c.free) {
              const dist = c.fretNum < b ? b - c.fretNum : (c.fretNum > b + TAB_BOX_SPAN ? c.fretNum - (b + TAB_BOX_SPAN) : 0);
              if (dist > 7) continue;
              if (dist > 0) { node += 10 + dist * 1.0; out = true; }   // ボックス外への一時的な「寄り道」（手の位置は戻す前提）
            }
            states.push({ ...c, box: b, out, midi: n.midi, node, absBeat: absBeatBase + n.beatPos });
          }
        });
        return states;
      });

      // Viterbi
      let prevCosts = layers[0].map(st => {
        let c = st.node;
        if (carry) c += tabTransitionCost(carry, st, st.absBeat - carry.absBeat);
        else c += Math.abs(st.box - 5) * 0.1;                         // 曲頭はミドルポジション付近から
        return c;
      });
      const back = [layers[0].map(() => -1)];
      for (let i = 1; i < layers.length; i++) {
        const cur = layers[i], prev = layers[i - 1];
        const costs = new Array(cur.length), bk = new Array(cur.length);
        for (let j = 0; j < cur.length; j++) {
          let best = Infinity, bi = 0;
          const gap = cur[j].absBeat - prev[0].absBeat;
          for (let k = 0; k < prev.length; k++) {
            const v = prevCosts[k] + tabTransitionCost(prev[k], cur[j], gap);
            if (v < best) { best = v; bi = k; }
          }
          costs[j] = best + cur[j].node; bk[j] = bi;
        }
        prevCosts = costs; back.push(bk);
      }
      let bj = 0;
      for (let j = 1; j < prevCosts.length; j++) if (prevCosts[j] < prevCosts[bj]) bj = j;
      const total = prevCosts[bj];
      const tabs = new Array(layers.length);
      for (let i = layers.length - 1; i >= 0; i--) { tabs[i] = layers[i][bj]; bj = back[i][bj]; }
      const own = tabs.slice(0, ownNotes.length);
      return { tabs: own, cost: total, last: own[own.length - 1] };
    };

    // 6弦ギター用 SVG TAB譜コンポーネント（TAB主役：コード名・ポジション・リズム・度数をTAB上に表示）
    const REST_SHAPES = {
      // 休符の簡易図形（y基準: リズム欄の中央）
      quarter: (x, y) => <path d={`M${x-2},${y-9} L${x+3},${y-4} L${x-1},${y} L${x+3},${y+5} Q${x-3},${y+3} ${x},${y+9}`} fill="none" stroke="#475569" strokeWidth="1.6" />,
      eighth: (x, y) => <g><circle cx={x-2} cy={y-3} r="1.8" fill="#475569" /><path d={`M${x-2},${y-2} Q${x+1},${y-1} ${x+3},${y-4} L${x-1},${y+7}`} fill="none" stroke="#475569" strokeWidth="1.4" /></g>,
      sixteenth: (x, y) => <g><circle cx={x-2} cy={y-5} r="1.6" fill="#475569" /><circle cx={x-3} cy={y} r="1.6" fill="#475569" /><path d={`M${x+3},${y-6} L${x-2},${y+8}`} fill="none" stroke="#475569" strokeWidth="1.4" /></g>,
      half: (x, y) => <rect x={x-5} y={y-3} width="10" height="4" fill="#475569" />,
      whole: (x, y) => <rect x={x-5} y={y-1} width="10" height="4" fill="#475569" />
    };

    const CIRCLED = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩"];
    const GuitarTab = ({ measures, perLine = 4, startMeasure = 0, curBeat = -1, hideFrets = false, showDegrees = true, showChordInfo = true }) => {
      // 和音の説明：小節ごとに、同じグループ（続けて動かす和音など）をまとめて番号を振る
      const marks = {};
      const legends = measures.map((m, mIdx) => {
        const groups = [], map = {};
        (m.notes || []).filter(n => n.isMain && n.chordDesc).sort((a, b) => a.beatPos - b.beatPos).forEach(n => {
          const g = n.chordDesc.group;
          if (!(g in map)) { map[g] = groups.length; groups.push({ style: n.chordDesc.style, runName: n.chordDesc.runName, degs: [] }); }
          groups[map[g]].degs.push(n.chordDesc.degs);
          marks[mIdx + ":" + n.beatPos.toFixed(3)] = map[g];
        });
        return groups;
      });
      const stringLabels = ["e", "B", "G", "D", "A", "E"];
      const L = 42, R = 1142, TOP = 40, GAP = 17;
      const BOTTOM = TOP + GAP * 5;           // 6弦の線
      const STEM_TOP = BOTTOM + 7, BEAM_Y = BOTTOM + 27, BEAM2_Y = BEAM_Y - 5;
      const REST_Y = BOTTOM + 18;
      const DEG_Y = BEAM_Y + 22;
      const H = DEG_Y + 8;
      const measureWidth = (R - L) / perLine;
      const xOf = (mStart, beat) => mStart + 22 + (beat / 4.0) * (measureWidth - 34);
      const near = (a, b) => Math.abs(a - b) < 0.02;

      return (
        <div className="w-full mt-1 mb-4">
          <svg viewBox={`0 0 1150 ${H}`} className="w-full h-auto select-none">
            {["T", "A", "B"].map((c, i) => (
              <text key={c} x="12" y={TOP + 26 + i * 18} fill="#0f172a" fontSize="14" fontWeight="800" fontFamily="sans-serif">{c}</text>
            ))}
            {stringLabels.map((lbl, idx) => (
              <text key={idx} x="30" y={TOP + 4 + idx * GAP} fill="#64748b" fontSize="10" fontWeight="700" fontFamily="monospace">{lbl}</text>
            ))}
            {[0, 1, 2, 3, 4, 5].map((i) => (
              <line key={i} x1={L} y1={TOP + i * GAP} x2={R} y2={TOP + i * GAP} stroke="#64748b" strokeWidth="1.1" />
            ))}
            <line x1={L} y1={TOP} x2={L} y2={BOTTOM} stroke="#0f172a" strokeWidth="2" />

            {measures.map((m, mIdx) => {
              const mStart = L + mIdx * measureWidth;
              const gIdx = startMeasure + mIdx;
              const local = curBeat - gIdx * 4;
              const isCur = curBeat >= 0 && local >= 0 && local < 4;
              const mains = (m.notes || []).filter(n => n.isMain).sort((a, b) => a.beatPos - b.beatPos);
              let activeBeat = null;
              if (isCur) mains.forEach(n => { if (n.beatPos <= local + 0.02) activeBeat = n.beatPos; });
              if (isCur && m.tieTails) m.tieTails.forEach(n => { if (n.beatPos <= local + 0.02 && (activeBeat === null || n.beatPos > activeBeat)) activeBeat = n.beatPos; });

              // リズム表示用：音符（和音は1つ）＋タイの後ろ側
              const rhythm = [...mains.map(n => ({ beatPos: n.beatPos, dur: n.dur })), ...((m.tieTails || []).map(n => ({ beatPos: n.beatPos, dur: n.dur })))]
                .sort((a, b) => a.beatPos - b.beatPos);
              const isShort = (d) => d < 0.99;
              const is16 = (d) => d < 0.3;              // 16分・3連16分
              const isTrip = (d) => Math.abs(d - 1/3) < 0.02 || Math.abs(d - 1/6) < 0.02;
              const groups = {};
              rhythm.forEach(r => { if (isShort(r.dur)) { const g = Math.floor(r.beatPos + 1e-6); (groups[g] = groups[g] || []).push(r); } });

              return (
                <g key={mIdx}>
                  {isCur && <rect x={mStart + 1} y={TOP - 30} width={measureWidth - 2} height={H - TOP + 26} fill="#fef3c7" opacity="0.45" />}
                  {m.hint && (
                    <text x={mStart + measureWidth - 6} y={TOP - 31} textAnchor="end" fill="#7c3aed" fontSize="10.5" fontWeight="700" fontFamily="sans-serif">{m.hint}</text>
                  )}
                  <text x={mStart + 8} y={TOP - 22} fill="#0f172a" fontSize="15" fontWeight="800" fontFamily="sans-serif">
                    {(m.chord || "").split(/\s+/).filter(Boolean).length === 2 ? "" : m.chord}
                  </text>
                  {(m.chord || "").split(/\s+/).filter(Boolean).length === 2 && (m.chord.split(/\s+/).filter(Boolean)).map((c, ci) => (
                    <text key={ci} x={xOf(mStart, ci * 2) - 10} y={TOP - 22} fill="#0f172a" fontSize="15" fontWeight="800" fontFamily="sans-serif">{c}</text>
                  ))}

                  {(m.notes || []).map((n, nIdx) => {
                    const xPos = xOf(mStart, n.beatPos);
                    const yPos = TOP + (5 - n.tab.stringIdx) * GAP;
                    const txt = hideFrets ? "?" : n.tab.fret;
                    const tw = String(txt).length >= 2 ? 16 : 11;
                    const active = activeBeat !== null && near(n.beatPos, activeBeat);
                    return (
                      <g key={nIdx}>
                        {n.posLabel && !hideFrets && (
                          <text x={xPos - 5} y={TOP - 8} textAnchor="start" fill="#b45309" fontSize="9.5" fontWeight="800" fontFamily="serif">{n.posFull && <title>{n.posFull}</title>}{n.posLabel}</text>
                        )}
                        <rect x={xPos - tw / 2} y={yPos - 7.5} width={tw} height={15} rx="3" fill={active ? "#f59e0b" : "#ffffff"} />
                        <text x={xPos} y={yPos + 4.5} textAnchor="middle" fill={active ? "#ffffff" : (hideFrets ? "#94a3b8" : "#0f172a")}
                          fontSize="13" fontWeight="800" fontFamily="ui-monospace, SFMono-Regular, Menlo, monospace">{txt}</text>
                      </g>
                    );
                  })}

                  {showChordInfo && (() => {
                    // 和音の一番上の音の右上に番号
                    const tops = {};
                    (m.notes || []).forEach(n => { const k = n.beatPos.toFixed(3); if (!(k in tops) || n.tab.stringIdx > tops[k]) tops[k] = n.tab.stringIdx; });
                    return Object.keys(tops).filter(k => (mIdx + ":" + k) in marks).map(k => {
                      const x = xOf(mStart, parseFloat(k)) + 10, y = TOP + (5 - tops[k]) * GAP - 6;
                      return <text key={"mk" + k} x={x} y={y} fill="#7c3aed" fontSize="10" fontWeight="800">{CIRCLED[marks[mIdx + ":" + k]] || "●"}</text>;
                    });
                  })()}

                  {(m.tieTails || []).flatMap((n, i) => (n.tabs || (n.tab ? [n.tab] : [])).map((tb, k) => {
                    const xPos = xOf(mStart, n.beatPos);
                    const yPos = TOP + (5 - tb.stringIdx) * GAP;
                    const txt = hideFrets ? "?" : `(${tb.fret})`;
                    return (
                      <g key={"t" + i + "_" + k}>
                        <rect x={xPos - 12} y={yPos - 7.5} width={24} height={15} fill="#ffffff" />
                        <text x={xPos} y={yPos + 4.5} textAnchor="middle" fill="#64748b" fontSize="12" fontWeight="700" fontFamily="ui-monospace, monospace">{txt}</text>
                      </g>
                    );
                  }))}

                  {/* リズム：符尾・連桁・付点 */}
                  {rhythm.map((r, i) => {
                    const x = xOf(mStart, r.beatPos);
                    if (r.dur >= 3.9) return null;                                        // 全音符：符尾なし
                    const stemBottom = r.dur >= 1.99 ? BEAM_Y - 9 : BEAM_Y;               // 2分音符は短い符尾
                    const dotted = [1.5, 3, 0.75, 2.5].some(d => near(r.dur, d));
                    const g = groups[Math.floor(r.beatPos + 1e-6)];
                    const single = isShort(r.dur) && (!g || g.length < 2);
                    return (
                      <g key={"r" + i}>
                        <line x1={x} y1={STEM_TOP} x2={x} y2={stemBottom} stroke="#334155" strokeWidth="1.4" />
                        {dotted && <circle cx={x + 5} cy={stemBottom - 3} r="1.8" fill="#334155" />}
                        {single && <path d={`M${x},${BEAM_Y} q6,-3 7,-9`} fill="none" stroke="#334155" strokeWidth="1.6" />}
                        {single && is16(r.dur) && <path d={`M${x},${BEAM2_Y} q6,-3 7,-9`} fill="none" stroke="#334155" strokeWidth="1.6" />}
                      </g>
                    );
                  })}
                  {Object.values(groups).filter(g => g.length >= 2).map((g, gi) => {
                    const x1 = xOf(mStart, g[0].beatPos), x2 = xOf(mStart, g[g.length - 1].beatPos);
                    const segs = [];
                    for (let k = 0; k < g.length - 1; k++) {
                      if (is16(g[k].dur) && is16(g[k + 1].dur)) segs.push([xOf(mStart, g[k].beatPos), xOf(mStart, g[k + 1].beatPos)]);
                    }
                    const trip = g.some(r => isTrip(r.dur));
                    return (
                      <g key={"b" + gi}>
                        <line x1={x1} y1={BEAM_Y} x2={x2} y2={BEAM_Y} stroke="#334155" strokeWidth="3" />
                        {segs.map(([a, b], si) => <line key={si} x1={a} y1={BEAM2_Y} x2={b} y2={BEAM2_Y} stroke="#334155" strokeWidth="3" />)}
                        {trip && <text x={(x1 + x2) / 2} y={BEAM_Y + 11} textAnchor="middle" fill="#334155" fontSize="10" fontWeight="700" fontStyle="italic">3</text>}
                      </g>
                    );
                  })}
                  {(m.rests || []).map((r, i) => {
                    const x = xOf(mStart, r.beatPos) + (r.dur >= 3.9 ? (measureWidth - 34) * 0.4 : 0);
                    const kind = r.dur >= 3.9 ? "whole" : r.dur >= 1.99 ? "half" : r.dur >= 0.99 ? "quarter" : r.dur >= 0.49 ? "eighth" : "sixteenth";
                    return <g key={"z" + i}>{REST_SHAPES[kind](x, REST_Y)}</g>;
                  })}

                  {showDegrees && mains.map((n, i) => n.label ? (
                    <text key={"d" + i} x={xOf(mStart, n.beatPos)} y={DEG_Y} textAnchor="middle" fill="#b45309"
                      fontSize={mains.length > 10 ? "9" : "10.5"} fontWeight="700" fontFamily="ui-monospace, monospace">{n.label}</text>
                  ) : null)}

                  <line x1={mStart + measureWidth} y1={TOP} x2={mStart + measureWidth} y2={BOTTOM}
                    stroke="#0f172a" strokeWidth={mIdx === measures.length - 1 && mIdx === perLine - 1 ? "2" : "1.3"} />
                </g>
              );
            })}
          </svg>
          {showChordInfo && legends.some(l => l.length > 0) && (
            <div className="grid gap-x-3 text-[11px] leading-snug text-violet-700 pb-1"
              style={{ gridTemplateColumns: `repeat(${perLine}, minmax(0, 1fr))`, paddingLeft: "3.6%", paddingRight: "0.7%" }}>
              {legends.map((gs, mIdx) => (
                <div key={mIdx} className="min-w-0">
                  {gs.map((g, k) => (
                    <div key={k} className="break-words">
                      <span className="font-extrabold">{CIRCLED[k] || "●"}</span>{" "}
                      {g.runName && <span className="font-bold">{g.runName}：</span>}
                      <span>{g.style}</span>
                      <span className="text-slate-500">{"　"}{g.degs.slice(0, 3).join(" → ")}{g.degs.length > 3 ? " …" : ""}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // レベル付きモード：使ってよいフレーズの範囲を決める（Lv3〜5は次のステップで実装）
    const MODES = [
      { id: "ALL", label: "All Mix", desc: "すべてのフレーズ" },
      { id: "LV1", label: "Lv1 Triad", desc: "トライアド・転回形・Drop 2/3",
        match: (c) => c.cat.includes("Triad") || c.cat.includes("Drop") },
      { id: "LV2", label: "Lv2 Bebop", desc: "クリスチャン・パーカー・コルトレーンのライン",
        match: (c) => ["Christian", "Parker", "Coltrane", "Bach Chromatic", "V7"].some(k => c.cat.includes(k)) },
      { id: "LV3", label: "Lv3 Barry Harris", desc: "6thディミニッシュ・スケール（メジャー6th／マイナー6th／7th）。m7は短3度上の6th、dim7は半音上のマイナー6thで考える",
        match: (c) => !!c.bh },
      { id: "LVM", label: "Lv3+ Minor Scales", desc: "maj7はトライアドかメジャー・スケール。7thは解決先でオルタード（半音上のMM）・フリジアン・ドミナント（解決先のHM）・ミクソ♭6、解決しない7thはリディアン♭7。m7b5はロクリアン♮2／♮6、dim7はHMの第7モード、マイナーはMM／HM",
        match: (c) => !!c.ms },
      { id: "LV4", label: "Lv4 Triad Pair", desc: "共通音のない2つのトライアドを切り替える（maj7=I+II、m7=bIII+IV、7th=bVII+I または bV+bVI、m7b5=bV+bVI、dim7=bVI+II）",
        match: (c) => !!c.tp },
      { id: "LV5", label: "Lv5 Lage", desc: "ラインの途中に和音を挟む（Drop 2・ガイドトーン・4度・トライアド、半音のアプローチ和音）。ラインはLv2〜4・Lv3+（メロディック／ハーモニックマイナー）とラーゲの実フレーズから",
        match: (c) => c.cat.includes("Lage") || c.cat.includes("Christian") },
      { id: "CM1", label: "CM1 ベース＋メロディ", cm: 1, desc: "コードメロディ：コードが変わるところだけ、ベース音を一緒に弾く" },
      { id: "CM2", label: "CM2 シェル", cm: 2, desc: "コードメロディ：コードの頭はベース＋ガイドトーン、強拍の長い音はガイドトーンを1つ下に足す" },
      { id: "CM3", label: "CM3 Drop 2・経過和音", cm: 3, desc: "コードメロディ：表拍の音はほぼ全部3〜4声。コードにない短い音は経過のdim7、分数コードはベースを動かす" },
      { id: "CM4", label: "CM4 内声を動かす", cm: 4, desc: "コードメロディ：CM3に加えて、長く伸びるメロディの下で内声を半音ずつ動かす（ライン・クリシェ）" }
    ];

    // Lv1用：Jazz Phrase（Lv2）のリズムと音の上下の形だけを借りて、音はトライアド（R・3・5）に置き換える
    const triadTones = (chord) => {
      const third = (chord.isMinor || chord.isDim) ? 3 : 4;
      const fifth = chord.isDim ? 6 : (/aug|\+|#5/.test(chord.name || "") ? 8 : 7);
      const out = [];
      for (let k = -2; k <= 5; k++) [0, third, fifth].forEach(t => out.push(t + 12 * k));
      return out.sort((a, b) => a - b);
    };
    const snapToTriad = (offs, tones) => {
      // 元フレーズの「上がる・下がる・同じ」をそのまま、トライアドの隣の音への動きに置き換える。
      // 半音の動きが続いて音域が広がりすぎる場合は、上下10半音の枠で折り返す（同音連打にはしない）
      const res = [];
      const up = (v) => tones.find(t => t > v);
      const down = (v) => [...tones].reverse().find(t => t < v);
      offs.forEach((o, i) => {
        if (i === 0) { res.push(tones.reduce((b, t) => Math.abs(t - o) < Math.abs(b - o) ? t : b, tones[0])); return; }
        const dir = Math.sign(o - offs[i - 1]);
        const prev = res[i - 1];
        if (dir === 0) { res.push(prev); return; }
        // 大きな跳躍は元の音に近いトライアド音へ、小さな動きは隣のトライアド音へ
        const near = tones.reduce((b, t) => Math.abs(t - o + (offs[0] - res[0])) < Math.abs(b - o + (offs[0] - res[0])) ? t : b, tones[0]);
        let v = Math.abs(o - offs[i - 1]) >= 5 && Math.sign(near - prev) === dir ? near : (dir > 0 ? up(prev) : down(prev));
        const lo = res[0] - 10, hi = res[0] + 10;
        if (v === undefined || v > hi || v < lo) v = dir > 0 ? down(prev) : up(prev);   // 枠を出るなら折り返す
        res.push(v);
      });
      return res;
    };
    const makeTriadFromDonor = (donor, chord, degrees) => {
      const offs = donor.d.map(dg => (degrees[dg] !== undefined ? degrees[dg] : 0));
      const snapped = snapToTriad(offs, triadTones(chord));
      return { cat: `Triad × ${donor.cat}`, p: donor.p, d: snapped.map(v => "s" + v), authentic: true, w: 2, borrowed: donor.cat };
    };

    // ── Lv3：バリー・ハリスの6thディミニッシュ・スケール ──
    // 8音スケール＝「6th（または7th）コード」＋「ディミニッシュ7th」。コードトーンから8分で動くと、表拍にコードトーンが来る
    const MAJ6_DIM = [0, 2, 4, 5, 7, 8, 9, 11];   // 例 C: C D E F G Ab A B（C6 + Bdim7）
    const MIN6_DIM = [0, 2, 3, 5, 7, 8, 9, 11];   // 例 C: C D Eb F G Ab A B（Cm6 + Bdim7）
    const DOM7_DIM = [0, 2, 4, 5, 7, 8, 10, 11];  // 例 C: C D E F G Ab Bb B（C7 + Bdim7）
    const bhScaleFor = (chord) => {
      const t = String(chord.name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      const sh = (arr, k) => arr.map(x => (x + k + 12) % 12);
      if (chord.isDim && !t.includes("m7b5") && !t.includes("ø"))      // dim7：半音上のマイナー6thディミニッシュ（C#dim7 → Dm6）。拍頭はdimの音
        return { pcs: sh(MIN6_DIM, 1), cts: [0, 3, 6, 9], name: "minor 6th dim（半音上）", shift: 1, kind: "m6 dim" };
      if (t.includes("m7b5") || t.includes("ø"))                         // m7b5：短3度上のマイナー6th（Dm7b5 → Fm6）
        return { pcs: sh(MIN6_DIM, 3), cts: [0, 3, 6, 10], name: "minor 6th dim（短3度上）", shift: 3, kind: "m6 dim" };
      if (chord.isMinor && (t.includes("6") || /mM|m\(maj|mmaj/i.test(t)))
        return { pcs: MIN6_DIM, cts: [0, 3, 7, 9], name: "minor 6th dim", shift: 0, kind: "m6 dim" };
      if (chord.isMinor)                                                 // m7：短3度上のメジャー6th（Dm7 → F6）
        return { pcs: sh(MAJ6_DIM, 3), cts: [0, 3, 7, 10], name: "6th dim（短3度上＝相対の6th）", shift: 3, kind: "6 dim" };
      if (chord.isV7) return { pcs: DOM7_DIM, cts: [0, 4, 7, 10], name: "7th dim", shift: 0, kind: "7 dim" };
      return { pcs: MAJ6_DIM, cts: [0, 4, 7, 9], name: "6th dim", shift: 0, kind: "6 dim" };
    };
    const bhLadder = (pcs) => { const out = []; for (let n = -24; n <= 36; n++) if (pcs.includes(((n % 12) + 12) % 12)) out.push(n); return out; };
    const bhWalk = (ladder, start, steps) => { const i = ladder.indexOf(start); return ladder[i + steps]; };
    const bhNextCT = (cts, v, dir) => { for (let k = 1; k <= 24; k++) { const c = v + dir * k; if (cts.includes(((c % 12) + 12) % 12)) return c; } return v; };
    // 4音（半小節）または8音（1小節）のライン。dir=-1 下降, +1 上昇
    const bhPatterns = (sc, ct, len) => {
      const L = bhLadder(sc.pcs), out = [];
      const run = (st, n, dir) => Array.from({ length: n }, (_, k) => bhWalk(L, st, dir * k));
      if (len === 4) {
        out.push({ k: "down", o: run(ct, 4, -1) });
        out.push({ k: "up", o: run(ct, 4, 1) });
        const c2 = bhNextCT(sc.cts, ct, 1), c3 = bhNextCT(sc.cts, c2, 1);
        out.push({ k: "arp-down", o: [ct, c2, c3, bhWalk(L, c3, -1)] });
        return out;
      }
      out.push({ k: "down8", o: run(ct, 8, -1) });
      out.push({ k: "up8", o: run(ct, 8, 1) });
      // アルペジオで上がって、スケールで下りる（バリー・ハリスの基本形）
      const a2 = bhNextCT(sc.cts, ct, 1), a3 = bhNextCT(sc.cts, a2, 1);
      out.push({ k: "arp-up/scale-down", o: [ct, a2, ...run(a3, 6, -1)] });
      // スケールで下りて、アルペジオで上がる
      const d5 = run(ct, 5, -1), last = d5[4];
      const u1 = bhNextCT(sc.cts, last, 1), u2 = bhNextCT(sc.cts, u1, 1), u3 = bhNextCT(sc.cts, u2, 1);
      out.push({ k: "scale-down/arp-up", o: [...d5, u1, u2, u3] });
      // 裏拍から入る：dimの音から始めて下降（表拍にコードトーン）
      out.push({ k: "pickup", rest: true, o: run(bhWalk(L, ct, 1), 7, -1) });
      return out;
    };
    const PC_NAMES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
    const bhHint = (chord, sc) => PC_NAMES[(chord.rootPc + sc.shift) % 12] + sc.kind.replace(/^m6/, "m6").replace(/^6/, "6").replace(/^7/, "7");
    // 8分×8のスロットに「休符・伸ばし」を入れるリズム型。n=音 h=前の音を伸ばす r=休符
    // 表拍（偶数スロット）の音は消すか伸ばすだけなので、「表拍にコードトーン」のルールは崩れない
    const REST_MASKS = [
      "nnnnnnhr", "nnnnnhrr", "nhnnnnnh", "rrnnnnnn", "nnrnnnnn", "nnnnrnnn",
      "nhrnnnnn", "nnnhrnnn", "nnnnnhnh", "rnnnnnhr", "nnnnnnrr", "nhnhnnnn"
    ];
    const applyMask = (offs, mask) => {
      const p = [], d = [];
      const DUR = { 1: "8", 2: "4", 3: "4.", 4: "2", 5: "2.5", 6: "2." };
      const REST = { 1: ["z8"], 2: ["z4"], 3: ["z4", "z8"], 4: ["z2"] };
      for (let i = 0; i < 8; ) {
        if (mask[i] === "r") { let j = i; while (j < 8 && mask[j] === "r") j++; p.push(...REST[j - i]); i = j; continue; }
        let j = i + 1; while (j < 8 && mask[j] === "h") j++;
        p.push(DUR[j - i]); d.push("s" + offs[i]); i = j;
      }
      return { p, d };
    };

    const makeBarryHarrisCells = (chord1, chord2, twoChords, useRests = true) => {
      const sc1 = bhScaleFor(chord1);
      const cells = [];
      const startCTs = [...sc1.cts, ...sc1.cts.map(c => c + 12)];
      const hint1 = bhHint(chord1, sc1);
      if (!twoChords) {
        startCTs.forEach(ct => bhPatterns(sc1, ct, 8).forEach(pt => {
          if (pt.o.some(v => v === undefined)) return;
          const p = pt.rest ? ["z8", "8", "8", "8", "8", "8", "8", "8"] : ["8", "8", "8", "8", "8", "8", "8", "8"];
          cells.push({ cat: `BarryHarris ${sc1.name} ${pt.k}`, p, d: pt.o.map(v => "s" + v), authentic: true, bh: true, hint: hint1 });
          if (pt.rest) return;
          // 休符・伸ばしを入れた形（ランダムに3つ）
          if (useRests) {
            [...REST_MASKS].sort(() => Math.random() - 0.5).slice(0, 2).forEach(mask => {
              const r = applyMask(pt.o, mask);
              cells.push({ cat: `BarryHarris ${sc1.name} ${pt.k} ${mask}`, p: r.p, d: r.d, authentic: true, bh: true, hint: hint1 });
            });
          }
        }));
        return cells;
      }
      // 1小節2コード：前半は chord1 のスケール、後半は chord2 のスケールで、同じ向きに続ける
      const sc2 = bhScaleFor(chord2);
      const diff = ((chord1.rootPc - chord2.rootPc) + 12) % 12;   // root1基準のオフセット → root2基準へ
      startCTs.forEach(ct => bhPatterns(sc1, ct, 4).forEach(pt => {
        if (pt.o.some(v => v === undefined)) return;
        const lastIn2 = pt.o[3] + diff;
        const dir = pt.k === "up" ? 1 : -1;
        const ct2 = bhNextCT(sc2.cts, lastIn2, dir);               // 次のコードのコードトーンへ半音・全音で着地
        const L2 = bhLadder(sc2.pcs);
        const half2 = Array.from({ length: 4 }, (_, k) => bhWalk(L2, ct2, dir * k));
        if (half2.some(v => v === undefined)) return;
        const offs = [...pt.o, ...half2];
        const hint = `${hint1} | ${bhHint(chord2, sc2)}`;
        cells.push({ cat: `BarryHarris ${sc1.name}→${sc2.name} ${pt.k}`, p: ["8", "8", "8", "8", "8", "8", "8", "8"],
          d: offs.map(v => "s" + v), authentic: true, bh: true, hint });
        // 2コードの小節は、各コードの頭（表拍）を残す形だけ使う
        if (useRests) ["nnnhnnnh", "nnnrnnnn", "nhnnnnnr"].forEach(mask => {
          const r = applyMask(offs, mask);
          cells.push({ cat: `BarryHarris ${sc1.name}→${sc2.name} ${pt.k} ${mask}`, p: r.p, d: r.d, authentic: true, bh: true, hint });
        });
      }));
      return cells;
    };

    // ── Lv3+：メロディックマイナー／ハーモニックマイナー ──
    // maj7はトライアドかメジャー・スケール。ドミナント7・マイナー・m7b5・dim7で、メロディックマイナー（MM）とハーモニックマイナー（HM）のモードを使う
    // pcs＝コードのルートから見たスケール音、ct＝コードトーン、color＝そのスケールらしい音（表拍に来てよい）、avoid＝表拍に置かない音、passing＝経過音としてだけ使う音
    const MM_PCS = [0, 2, 3, 5, 7, 9, 11], HM_PCS = [0, 2, 3, 5, 7, 8, 11];
    const shiftPcs = (arr, k) => arr.map(x => (x + k) % 12).sort((a, b) => a - b);   // 親スケールのルートがコードのルート+k
    const msScalesFor = (chord, next, focus) => {
      const q = chordQuality(chord.name);
      const t = String(chord.name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      const nm = (k) => PC_NAMES[(chord.rootPc + k) % 12];
      const out = [];
      const add = (fam, k, mode, o) => out.push({ fam, pcs: shiftPcs(fam === "MM" ? MM_PCS : HM_PCS, k), mode, par: { fam, root: (chord.rootPc + k) % 12 },
        hint: `${nm(k)} ${fam === "MM" ? "mel.min" : "har.min"}${mode ? "＝" + mode : ""}`, ...o });
      const nq = next ? chordQuality(next.name) : null;
      const down5 = next && ((next.rootPc - chord.rootPc + 12) % 12) === 5;      // 5度下（4度上）へ解決
      const downHalf = next && ((next.rootPc - chord.rootPc + 12) % 12) === 11;  // 半音下へ（裏コード）
      const wantMM = focus !== "HM", wantHM = focus !== "MM";
      if (q === "maj") {
        if (/#5|\+|aug/.test(t)) { add("MM", 9, "リディアン♯5", { ct: [0, 4, 8, 11], color: [2, 6, 9], avoid: [] }); return out; }
        const lyd = /#11|#4/.test(t);
        out.push({ fam: "MAJ", par: { fam: "MAJ", root: (chord.rootPc + (lyd ? 7 : 0)) % 12 }, pcs: lyd ? [0, 2, 4, 6, 7, 9, 11] : [0, 2, 4, 5, 7, 9, 11], hint: `${nm(0)} ${lyd ? "リディアン" : "メジャー・スケール"}`,
          ct: [0, 4, 7, t.includes("6") ? 9 : 11], color: [2, 9], avoid: lyd ? [] : [5] });
        out.push({ fam: "TRI", par: { fam: "MAJ", root: chord.rootPc }, pcs: [0, 4, 7], hint: `${nm(0)} トライアド`, ct: [0, 4, 7], color: [], avoid: [] });
        return out;
      }
      if (q === "dom") {
        const altName = /alt|b9|#9|b13|#5|\+/.test(t);
        if (!altName && (/#11/.test(t) || downHalf || (next && !down5))) {        // 解決しないドミナント・裏コード
          add("MM", 7, "リディアン♭7", { ct: [0, 4, 7, 10], color: [2, 6, 9], avoid: [] });
          if (!wantHM || !down5) return out;
        }
        const toMinor = nq === "min" || nq === "hdim" || nq === "dim";
        if (wantMM || !toMinor) {
          add("MM", 1, "オルタード", { ct: [0, 4, 10], color: [1, 3, 6, 8], avoid: [] });
          out.push({ fam: "PENT", par: { fam: "MM", root: (chord.rootPc + 1) % 12 }, pcs: shiftPcs([0, 3, 5, 7, 10], 3), hint: `${nm(3)}mペンタ＝オルタード`, ct: [10], color: [1, 3, 6, 8], avoid: [] });
        }
        if (wantMM && toMinor) add("MM", 5, "ミクソ♭6", { ct: [0, 4, 7, 10], color: [2, 8], avoid: [5] });
        if (wantHM) add("HM", 5, "フリジアン・ドミナント", { ct: [0, 4, 7, 10], color: [1, 8], avoid: [5] });
        return out;
      }
      if (q === "hdim") {
        if (wantMM) add("MM", 3, "ロクリアン♮2", { ct: [0, 3, 6, 10], color: [2, 5], avoid: [] });
        if (wantHM) add("HM", 10, "ロクリアン♮6", { ct: [0, 3, 6, 10], color: [5, 9], avoid: [1] });
        return out;
      }
      if (q === "dim") { add("HM", 1, "dim7（第7モード）", { ct: [0, 3, 6, 9], color: [1, 8], avoid: [] }); return out; }
      // マイナー：ii（次が4度上のドミナント）ならジャズ・マイナー（♮7は経過音だけ）。トニックのマイナーなら MM・HM どちらも
      const isII = next && nq === "dom" && down5 && !/maj|M7|6/.test(t);
      const m7 = /7|9|11/.test(t) && !/maj|M7/.test(t);                          // m7系では ♮7 は経過音としてだけ使う
      if (isII || wantMM) add("MM", 0, isII ? "m6の響き" : "", { ct: [0, 3, 7], color: m7 ? [2, 5, 9] : [2, 5, 9, 11], avoid: [], passing: m7 ? [11] : [] });
      if (!isII && wantHM) add("HM", 0, "", { ct: [0, 3, 7], color: m7 ? [2, 5, 8] : [2, 5, 8, 11], avoid: [], passing: m7 ? [11] : [] });
      if (!out.length) add("MM", 0, "", { ct: [0, 3, 7], color: [2, 5, 9], avoid: [] });
      return out;
    };
    // スケール上の何音目に動くか（累積）。8分×8
    const MS_PAT8 = [
      { k: "下降", s: [0, -1, -1, -1, -1, -1, -1, -1] },
      { k: "上昇", s: [0, 1, 1, 1, 1, 1, 1, 1] },
      { k: "アルペジオ↑→スケール↓", s: [0, 2, 2, 2, -1, -1, -1, -1] },
      { k: "スケール↓→アルペジオ↑", s: [0, -1, -1, -1, -1, 2, 2, 2] },
      { k: "アルペジオ↓→スケール↑", s: [0, -2, -2, -2, 1, 1, 1, 1] },
      { k: "1-2-3-5", s: [0, 1, 1, 2, -1, -1, -1, -2] },
      { k: "3度の下降", s: [0, 2, -3, 2, -3, 2, -3, 2] },
      { k: "3度の上昇", s: [0, -2, 3, -2, 3, -2, 3, -2] },
      { k: "ターン", s: [0, 1, -1, -1, 1, 2, 2, -1] }
    ];
    const MS_PAT_TRI = [
      { k: "トライアド↑↓", s: [0, 1, 1, 1, -1, -1, -1, -1] },
      { k: "トライアド↓↑", s: [0, -1, -1, -1, 1, 1, 1, 1] },
      { k: "トライアド折り返し", s: [0, 1, -1, 2, -1, 2, -1, -1] },
      { k: "トライアドの波", s: [0, 2, -1, 2, -1, -1, -1, 1] }
    ];
    const MS_PAT4 = [
      { k: "下降", s: [0, -1, -1, -1] }, { k: "上昇", s: [0, 1, 1, 1] },
      { k: "アルペジオ↑", s: [0, 2, 2, -1] }, { k: "アルペジオ↓", s: [0, -2, -2, 1] }, { k: "1-2-3-5", s: [0, 1, 1, 2] }
    ];
    const msWalk = (sc, startPc, pat) => {
      const L = bhLadder(sc.pcs);
      let i = L.indexOf(startPc); if (i < 0) return null;
      const o = [];
      for (const st of pat.s) { i += st; if (i < 0 || i >= L.length) return null; o.push(L[i]); }
      return o;
    };
    // 表拍（0,2,4,6）にアボイドを置かない・コードトーンかカラーを3つ以上・経過音は前後が2半音以内
    const msLineOk = (sc, o, strongIdx) => {
      const pc = (v) => ((v % 12) + 12) % 12;
      let good = 0;
      for (const i of strongIdx) {
        const x = pc(o[i]);
        if ((sc.avoid || []).includes(x) || (sc.passing || []).includes(x)) return false;
        if (sc.ct.includes(x) || sc.color.includes(x)) good++;
      }
      if (good < Math.ceil(strongIdx.length * 0.7)) return false;
      for (let i = 0; i < o.length; i++) {
        if (!(sc.passing || []).includes(pc(o[i]))) continue;
        if ((i > 0 && Math.abs(o[i] - o[i - 1]) > 2) || (i < o.length - 1 && Math.abs(o[i + 1] - o[i]) > 2)) return false;
      }
      for (let i = 1; i < o.length; i++) if (o[i] === o[i - 1]) return false;
      if (sc.color.length && !o.some(v => sc.color.includes(pc(v)))) return false;   // そのスケールらしい音を1つは入れる
      return true;
    };
    const msStarts = (sc) => { const st = sc.ct.length ? sc.ct : sc.color; return [...st, ...st.map(c => c + 12)].filter(v => sc.pcs.includes(((v % 12) + 12) % 12)); };
    const makeMinorScaleCells = (chord1, chord2, twoChords, useRests, nextChord, focus) => {
      const cells = [];
      if (!twoChords) {
        msScalesFor(chord1, nextChord, focus).forEach(sc => {
          const pats = sc.fam === "TRI" ? MS_PAT_TRI : MS_PAT8;
          msStarts(sc).forEach(st => pats.forEach(pt => {
            const o = msWalk(sc, st, pt);
            if (!o || !msLineOk(sc, o, [0, 2, 4, 6])) return;
            const cat = `MinorScale ${sc.hint} ${pt.k}`;
            cells.push({ cat, p: ["8", "8", "8", "8", "8", "8", "8", "8"], d: o.map(v => "s" + v), authentic: true, ms: true, hint: sc.hint, msParents: [sc.par] });
            if (useRests) [...REST_MASKS].sort(() => Math.random() - 0.5).slice(0, 2).forEach(mask => {
              const r = applyMask(o, mask);
              if (r.d.length >= 4) cells.push({ cat: `${cat} ${mask}`, p: r.p, d: r.d, authentic: true, ms: true, hint: sc.hint, msParents: [sc.par] });
            });
          }));
        });
        return cells;
      }
      // 1小節2コード：前半4音は chord1 のスケール、後半4音は chord2 のスケールで、同じ向きに続ける
      const diff = ((chord1.rootPc - chord2.rootPc) + 12) % 12;
      const scs1 = msScalesFor(chord1, chord2, focus).filter(sc => sc.fam !== "TRI" && sc.fam !== "PENT");
      const scs2 = msScalesFor(chord2, nextChord, focus).filter(sc => sc.fam !== "TRI" && sc.fam !== "PENT");
      scs1.forEach(sc1 => scs2.forEach(sc2 => msStarts(sc1).forEach(st => MS_PAT4.forEach(pt => {
        const o1 = msWalk(sc1, st, pt);
        if (!o1 || !msLineOk({ ...sc1, color: [] }, o1, [0, 2])) return;
        const dir = pt.s[3] >= 0 && pt.k !== "アルペジオ↑" ? 1 : -1;
        const last = o1[3] + diff;
        // 次のコードのコードトーンへ半音・全音で着地
        let st2 = null;
        for (let k = 1; k <= 2 && st2 === null; k++) { const c = last + dir * k; if (sc2.ct.includes(((c % 12) + 12) % 12)) st2 = c; }
        if (st2 === null) return;
        MS_PAT4.forEach(pp => {
          const o2 = msWalk(sc2, st2, pp);
          if (!o2 || !msLineOk({ ...sc2, color: [] }, o2, [0, 2]) || o2[0] === o1[3] + diff) return;
          const offs = [...o1, ...o2];
          if (sc1.color.length + sc2.color.length && ![...o1.map(v => [sc1, v]), ...o2.map(v => [sc2, v])].some(([sc, v]) => sc.color.includes(((v % 12) + 12) % 12))) return;
          const hint = `${sc1.hint} | ${sc2.hint}`;
          const cat = `MinorScale ${hint} ${pt.k}/${pp.k}`;
          cells.push({ cat, p: ["8", "8", "8", "8", "8", "8", "8", "8"], d: offs.map(v => "s" + v), authentic: true, ms: true, hint, msParents: [sc1.par, sc2.par] });
          if (useRests) ["nnnhnnnh", "nnnrnnnn", "nhnnnnnr"].forEach(mask => {
            const r = applyMask(offs, mask);
            cells.push({ cat: `${cat} ${mask}`, p: r.p, d: r.d, authentic: true, ms: true, hint, msParents: [sc1.par, sc2.par] });
          });
        });
      }))));
      return cells;
    };

    // ── Lv4：トライアド・ペア（共通音のない2つのメジャー・トライアドで6音を作る）──
    // 値＝コードのルートから見たトライアドのルート（半音）。どちらもメジャー・トライアド
    const triadPairsFor = (chord) => {
      const t = String(chord.name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      if (chord.isDim && !t.includes("m7b5")) return [{ r: [8, 2], name: "dim" }];                  // C#dim7 → A + Eb
      if (t.includes("m7b5") || t.includes("ø")) return [{ r: [6, 8], name: "locrian" }];          // Bm7b5 → F + G
      if (chord.isMinor) return [{ r: [3, 5], name: "dorian" }];                                    // Dm7 → F + G
      if (chord.isV7) return [{ r: [10, 0], name: "mixolydian" }, { r: [6, 8], name: "altered" }];  // G7 → F + G ／ Db + Eb
      return [{ r: [0, 2], name: "lydian" }];                                                       // Cmaj7 → C + D
    };
    const triadPcs = (root) => [0, 4, 7].map(x => (root + x) % 12);
    // 指定トライアドの音で v より上（dir=1）／下（dir=-1）の一番近い音
    const nextInTriad = (pcs, v, dir) => { for (let k = 1; k <= 12; k++) { const c = v + dir * k; if (pcs.includes(((c % 12) + 12) % 12)) return c; } return v; };
    const tpLine = (A, B, start, group, n, dir, zigzag) => {
      // group 音ずつ A→B→A… と切り替える。zigzag なら1グループごとに向きを反転
      const out = [start]; let cur = start, tri = 0, inGroup = 1, d = dir;
      while (out.length < n) {
        if (inGroup >= group) { tri = 1 - tri; inGroup = 0; if (zigzag) d = -d; }
        cur = nextInTriad(tri === 0 ? A : B, cur, d);
        out.push(cur); inGroup++;
      }
      return out;
    };
    const makeTriadPairCells = (chord1, chord2, twoChords, useRests = true) => {
      const cells = [];
      const pairs = triadPairsFor(chord1);
      pairs.forEach(pr => {
        const A = triadPcs(pr.r[0]), B = triadPcs(pr.r[1]);
        const hint = `${PC_NAMES[(chord1.rootPc + pr.r[0]) % 12]}+${PC_NAMES[(chord1.rootPc + pr.r[1]) % 12]}`;
        const starts = [];
        for (let v = 0; v < 24; v++) if (A.includes(v % 12)) starts.push(v);
        if (twoChords) {
          // 前半だけトライアド・ペア、後半は次のコードのペアへ近い音で続ける
          const pr2 = triadPairsFor(chord2)[0];
          const A2 = triadPcs(pr2.r[0]), B2 = triadPcs(pr2.r[1]);
          const diff = ((chord1.rootPc - chord2.rootPc) + 12) % 12;
          const hint2 = `${hint} | ${PC_NAMES[(chord2.rootPc + pr2.r[0]) % 12]}+${PC_NAMES[(chord2.rootPc + pr2.r[1]) % 12]}`;
          starts.forEach(st => [1, -1].forEach(dir => {
            const h1 = tpLine(A, B, st, 2, 4, dir, false);
            const s2 = nextInTriad(A2, h1[3] + diff, dir);
            const h2 = tpLine(A2, B2, s2, 2, 4, dir, false);
            const o = [...h1, ...h2];
            cells.push({ cat: `TriadPair ${pr.name} 2+2`, p: ["8","8","8","8","8","8","8","8"], d: o.map(v => "s" + v), authentic: true, tp: true, hint: hint2 });
            if (useRests) ["nnnhnnnh", "nnnrnnnn", "nhnnnnnr"].forEach(mask => {
              const r = applyMask(o, mask);
              cells.push({ cat: `TriadPair ${pr.name} 2+2 ${mask}`, p: r.p, d: r.d, authentic: true, tp: true, hint: hint2 });
            });
          }));
          return;
        }
        starts.forEach(st => [1, -1].forEach(dir => {
          const shapes = [
            { k: "3+3", o: tpLine(A, B, st, 3, 8, dir, false), p: Array(8).fill("8") },
            { k: "2+2", o: tpLine(A, B, st, 2, 8, dir, false), p: Array(8).fill("8") },
            { k: "3+3 zigzag", o: tpLine(A, B, st, 3, 8, dir, true), p: Array(8).fill("8") },
            // 3連符：1拍ごとにトライアドを切り替える（ラーゲ・ルンドがよく使う形）
            { k: "triplets", o: tpLine(A, B, st, 3, 12, dir, false), p: Array(12).fill("trip8") },
            { k: "triplets arch", o: null, p: Array(12).fill("trip8"), arch: true }
          ];
          shapes.forEach(sh => {
            let o = sh.o;
            if (sh.arch) {  // 上がった頂点から、同じトライアドの切り替えで下りる
              const up = tpLine(A, B, st, 3, 6, dir, false);
              const down = tpLine(B, A, nextInTriad(B, up[5], -dir), 3, 6, -dir, false);
              o = [...up, ...down];
            }
            if (Math.max(...o) - Math.min(...o) > 26) return;
            cells.push({ cat: `TriadPair ${pr.name} ${sh.k}`, p: sh.p, d: o.map(v => "s" + v), authentic: true, tp: true, hint });
            if (useRests && sh.p.length === 8) {
              [...REST_MASKS].sort(() => Math.random() - 0.5).slice(0, 2).forEach(mask => {
                const r = applyMask(o, mask);
                cells.push({ cat: `TriadPair ${pr.name} ${sh.k} ${mask}`, p: r.p, d: r.d, authentic: true, tp: true, hint });
              });
            }
          });
        }));
      });
      return cells;
    };

    // ── Lv5：ラインの途中に和音を挟む（ラーゲ・ルンドの Chordal Vocabulary の考え方を簡略化）──
    // メロディ音を一番上に置いたまま、その下に和音の音を足す。形は4種類：
    //   drop2   … 4声のDrop 2（3度↔9度、ルート↔7度などの入れ替え形も含む）
    //   shell   … メロディ＋ガイドトーン（3度・7度）の3声
    //   quartal … メロディから完全4度を2つ下に重ねる
    //   triad   … メロディを一番上にしたトライアド（Lv4のペアから）
    // さらに、和音の直前の音が半音隣なら、同じ形を半音ずらした「アプローチ和音」にする
    const lageQuality = (chord) => {
      const t = String(chord.name || "").replace(/^[A-G][#b]?/, "").split("/")[0];
      if (t.includes("m7b5") || t.includes("ø")) return "hdim";
      if (chord.isDim) return "dim";
      if (chord.isMinor) return "min";
      if (chord.isV7) return "dom";
      if (/^6|^69/.test(t)) return "maj6";
      return "maj";
    };
    const LAGE_SETS = {   // 4声の組（コードのルートからの半音）。2つ目以降は入れ替え形
      maj:  [[0, 4, 7, 11], [2, 4, 7, 11], [0, 2, 7, 11], [0, 4, 9, 11], [2, 4, 9, 11]],
      maj6: [[0, 4, 7, 9], [2, 4, 7, 9], [0, 2, 7, 9]],
      min:  [[0, 3, 7, 10], [2, 3, 7, 10], [3, 5, 7, 10], [0, 3, 5, 10]],
      dom:  [[0, 4, 7, 10], [2, 4, 9, 10], [1, 4, 8, 10], [0, 4, 9, 10], [3, 4, 8, 10], [1, 4, 9, 10]],
      hdim: [[0, 3, 6, 10], [3, 5, 6, 10]],
      dim:  [[0, 3, 6, 9], [2, 5, 8, 11]]
    };
    const LAGE_SET_NAMES = {
      maj:  ["基本形", "R→9", "3→9", "5→13", "R→9・5→13"],
      maj6: ["基本形", "R→9", "3→9"],
      min:  ["基本形", "R→9", "R→11", "5→11"],
      dom:  ["基本形", "R→9・5→13", "オルタード（b9・b13）", "5→13", "オルタード（#9・b13）", "13（b9）"],
      hdim: ["基本形", "R→11"],
      dim:  ["基本形", "全音上のdim"]
    };
    const LAGE_SCALES = {
      maj: [0, 2, 4, 6, 7, 9, 11], maj6: [0, 2, 4, 5, 7, 9, 11], min: [0, 2, 3, 5, 7, 9, 10],
      dom: [0, 2, 4, 5, 7, 9, 10], hdim: [0, 1, 3, 5, 6, 8, 10], dim: [0, 2, 3, 5, 6, 8, 9, 11]
    };
    const pcRel = (m, root) => (((m - root) % 12) + 12) % 12;
    const nextBelowPc = (v, pcs, rootPc) => { for (let k = 1; k <= 12; k++) if (pcs.includes(pcRel(v - k, rootPc))) return v - k; return null; };
    const nextAbovePc = (v, pcs, rootPc) => { for (let k = 1; k <= 12; k++) if (pcs.includes(pcRel(v + k, rootPc))) return v + k; return null; };
    // 4声の組 set（ルート rootPc からの半音）で、m を一番上にした Drop 2 の下3声
    const drop2Under = (m, set, rootPc) => {
      const others = set.filter(x => x !== pcRel(m, rootPc));
      const a = nextBelowPc(m, others, rootPc), b = a !== null ? nextBelowPc(a, others, rootPc) : null, c = b !== null ? nextBelowPc(b, others, rootPc) : null;
      if (a === null || b === null || c === null) return null;
      return [b, c, a - 12];                       // 上から2番目の音を1オクターブ下げる＝Drop 2
    };
    // 戻り値 { notes: [メロディの下に足す音], style: 説明 }
    const lageVoicing = (m, chord, style) => {
      const q = lageQuality(chord), r = chord.rootPc, rel = pcRel(m, r);
      if (style === "drop2") {
        let idxs = LAGE_SETS[q].map((st, i) => st.includes(rel) ? i : -1).filter(i => i >= 0);
        let set, name;
        if (idxs.length) {
          const i = idxs[Math.floor(Math.random() * idxs.length)];
          set = LAGE_SETS[q][i]; name = LAGE_SET_NAMES[q][i];
        } else {   // メロディがテンション：一番近いコードトーンと入れ替える
          const base = LAGE_SETS[q][0];
          const dist = (x) => Math.min((x - rel + 12) % 12, (rel - x + 12) % 12);
          const near = base.reduce((b, x) => dist(x) < dist(b) ? x : b, base[0]);
          set = base.map(x => x === near ? rel : x); name = "メロディのテンションと入れ替え";
        }
        const v = drop2Under(m, set, r);
        return v ? { notes: v, style: `Drop 2（${name}）` } : { notes: [], style: "" };
      }
      if (style === "shell") {
        const third = (q === "min" || q === "hdim" || q === "dim") ? 3 : 4;
        const sev = q === "maj" ? 11 : (q === "maj6" || q === "dim") ? 9 : 10;
        let guides = [third, sev].filter(x => x !== rel);
        if (guides.length < 2) guides = [...guides, 0].filter(x => x !== rel);
        const out = []; let cur = m;
        guides.map(g => nextBelowPc(m, [g], r)).sort((x, y) => y - x).forEach(v => { if (v !== null && v < cur) { out.push(v); cur = v; } });
        return { notes: out.slice(0, 2), style: "シェル（3度と7度）" };
      }
      if (style === "quartal") {
        const sc = LAGE_SCALES[q];
        if (sc.includes(pcRel(m - 5, r)) && sc.includes(pcRel(m - 10, r))) return { notes: [m - 5, m - 10], style: "4度堆積" };
        if (sc.includes(pcRel(m - 6, r)) && sc.includes(pcRel(m - 11, r))) return { notes: [m - 6, m - 11], style: "4度堆積（増4度を含む）" };
        return lageVoicing(m, chord, "shell");
      }
      // triad：Lv4のペアのうち、メロディを含むトライアドを密集形で
      for (const pr of triadPairsFor(chord)) for (const t of pr.r) {
        const pcs = [0, 4, 7].map(x => (t + x) % 12);
        if (pcs.includes(rel)) {
          const others = pcs.filter(x => x !== rel);
          const a = nextBelowPc(m, others, r), b = a !== null ? nextBelowPc(a, others, r) : null;
          if (a !== null && b !== null) return { notes: [a, b], style: `${PC_NAMES[(r + t) % 12]}トライアド（アッパー・ストラクチャー）` };
        }
      }
      return lageVoicing(m, chord, "shell");
    };
    const BEATS_OF = { "8": .5, "4": 1, "4.": 1.5, "2": 2, "2.": 3, "2..": 3.5, "2.5": 2.5, "1": 4, "16": .25, "trip8": 1/3, "trip16": 1/6,
      "z8": .5, "z4": 1, "z2": 2, "z1": 4, "z16": .25 };
    const LAGE_DENSITY = {
      low:  { long: .35, head: .12, other: 0,   run2: .2,  run3: .05 },
      mid:  { long: .7,  head: .35, other: .06, run2: .35, run3: .15 },
      high: { long: .9,  head: .6,  other: .15, run2: .45, run3: .25 }
    };
    // セル1つ分の和音プラン（音のインデックス → { notes, style, group }）
    const planLageVoicings = (cell, chord1, chord2, root1, root2, density) => {
      const D = LAGE_DENSITY[density] || LAGE_DENSITY.mid;
      const notes = []; let beat = 0, ni = 0;
      cell.p.forEach((dt, ei) => {
        const b = BEATS_OF[dt] || .5;
        if (!dt.startsWith("z")) {
          const ch = beat < 2 - 1e-6 ? chord1 : chord2, rt = beat < 2 - 1e-6 ? root1 : root2;
          const deg = cell.d[ni];
          const top = Array.isArray(deg) ? deg[0] : deg;
          const off = getChordDegrees(ch)[top];
          const nextIsRest = ei + 1 < cell.p.length && cell.p[ei + 1].startsWith("z");
          notes.push({ i: ni, beat, dur: b, midi: rt + (off || 0), chord: ch, hasOwn: Array.isArray(deg), nextIsRest });
          ni++;
        }
        beat += b;
      });
      const plan = new Array(ni).fill(null);
      if (cell.ci) return plan;                                        // 和音の動きを持つセルはそのまま
      const styles = ["drop2", "drop2", "shell", "shell", "quartal", "triad"];
      let group = 0;
      const ok = (n) => n && !n.hasOwn && n.midi >= 60;               // メロディがC4より低いときは和音を付けない（濁るため）
      for (let k = 0; k < notes.length; k++) {
        const n = notes[k];
        if (!ok(n) || plan[n.i]) continue;
        const onBeat = Math.abs(n.beat - Math.round(n.beat)) < .01;
        const isHead = onBeat && (n.beat === 0 || (chord2 !== chord1 && Math.abs(n.beat - 2) < .01));
        const prob = n.dur >= .99 || n.nextIsRest ? D.long : isHead ? D.head : (onBeat ? D.other : 0);
        if (Math.random() >= prob) continue;
        const style = styles[Math.floor(Math.random() * styles.length)];
        const v = lageVoicing(n.midi, n.chord, style);
        const vn = v.notes.filter(x => x >= 48 && x < n.midi);
        if (!vn.length) continue;
        group++;
        plan[n.i] = { notes: vn, style: v.style, group };
        // 和音を2〜3個続けて動かす（同じ形のまま、次のメロディ音の下でも作る）
        const runLen = Math.random() < D.run3 ? 3 : (Math.random() < D.run2 ? 2 : 1);
        let last = k;
        for (let j = k + 1; j < notes.length && j < k + runLen; j++) {
          const nj = notes[j];
          if (!ok(nj) || nj.chord !== n.chord || Math.abs(notes[j - 1].beat + notes[j - 1].dur - nj.beat) > .01) break;
          const vj = lageVoicing(nj.midi, nj.chord, style);
          const vjn = vj.notes.filter(x => x >= 48 && x < nj.midi);
          if (!vjn.length) break;
          plan[nj.i] = { notes: vjn, style: vj.style, group, run: true };
          last = j;
        }
        if (last > k) { for (let j = k; j <= last; j++) plan[notes[j].i].runName = "和音を続けて動かす"; k = last; continue; }
        // 半音隣からのアプローチ和音（同じ形を半音ずらす）
        const pv = notes[k - 1];
        if (pv && ok(pv) && !plan[pv.i] && Math.abs(pv.midi - n.midi) === 1 && pv.dur <= .51 && Math.abs(pv.beat + pv.dur - n.beat) < .01 && Math.random() < .6) {
          const shift = pv.midi - n.midi;
          const an = vn.map(x => x + shift).filter(x => x >= 48);
          if (an.length) {
            plan[pv.i] = { notes: an, style: `${v.style}を半音${shift > 0 ? "上" : "下"}から`, group, approach: true };
            plan[pv.i].runName = plan[n.i].runName = "半音のアプローチ和音";
          }
        }
      }
      return plan;
    };

    // ── Lv5：和音そのものが動くフレーズ（1小節・1コード用）──
    // 各音を [メロディ, 下の音…] の配列（ルートからの半音 "sN"）で持ち、ci に説明を入れる
    const makeLageMotionCells = (chord) => {
      const q = lageQuality(chord), r = chord.rootPc;   // ここでは r=0 基準の相対値で作る
      const cells = [];
      const S = (v) => "s" + v;
      const chordDeg = (arr) => arr.map(S);
      const set0 = LAGE_SETS[q][0];
      const triad = q === "dim" ? [0, 3, 6] : q === "hdim" ? [0, 3, 6] : (q === "min" ? [0, 3, 7] : [0, 4, 7]);
      // 1) 転回形の連続：コードトーンを上がりながら、毎回メロディが一番上の形にする
      for (const start of set0.map(x => x + 12)) {
        [1, -1].forEach(dir => {
          const mel = [start]; for (let k = 1; k < 4; k++) mel.push((dir > 0 ? nextAbovePc : nextBelowPc)(mel[k - 1], set0, 0));
          const vs = mel.map(m => drop2Under(m, set0, 0));
          if (vs.some(v => !v)) return;
          cells.push({ cat: "Lage motion inversions drop2", p: ["4", "4", "4", "4"], d: mel.map((m, k) => chordDeg([m, ...vs[k]])), authentic: true, lage5: true,
            ci: mel.map(() => ({ style: "Drop 2の転回形を続けて動かす", group: 1, motion: true })) });
          // 3声のトライアドで、8分の2拍＋単音のライン
          const tm = [start]; for (let k = 1; k < 3; k++) tm.push((dir > 0 ? nextAbovePc : nextBelowPc)(tm[k - 1], triad, 0));
          const tv = tm.map(m => { const o = triad.filter(x => x !== pcRel(m, 0)); const a = nextBelowPc(m, o, 0); const b = a !== null ? nextBelowPc(a, o, 0) : null; return (a !== null && b !== null) ? [a, b] : null; });
          if (tv.some(v => !v)) return;
          const tail = []; let cur = tm[2]; const sc = LAGE_SCALES[q];
          for (let k = 0; k < 4; k++) { cur = (dir > 0 ? nextBelowPc : nextAbovePc)(cur, sc, 0); tail.push(cur); }
          cells.push({ cat: "Lage motion triad inversions", p: ["8", "8", "4", "8", "8", "8", "8"], d: [...tm.map((m, k) => chordDeg([m, ...tv[k]])), ...tail.map(S)], authentic: true, lage5: true,
            ci: [...tm.map(() => ({ style: "トライアドの転回形を続けて動かす", group: 1, motion: true })), null, null, null, null] });
        });
      }
      // 2) 1つのコードの中で動かす：6th（コードトーン）⇄ dim（経過音）の和音（バリー・ハリス）
      const sc = bhScaleFor(chord);
      const dimSet = sc.pcs.filter(x => !sc.cts.includes(x));
      const ctSet = sc.cts.length === 4 ? sc.cts : set0;
      for (const start of ctSet.map(x => x + 12)) {
        [-1, 1].forEach(dir => {
          const L = bhLadder(sc.pcs);
          const mel = [0, 1, 2, 3, 4].map(k => bhWalk(L, start, dir * k));
          if (mel.some(v => v === undefined)) return;
          const vs = mel.map(m => drop2Under(m, ctSet.includes(pcRel(m, 0)) ? ctSet : dimSet, 0));
          if (vs.some(v => !v)) return;
          const ci = mel.map(m => ({ style: ctSet.includes(pcRel(m, 0)) ? "6th（コードトーンの和音）" : "dim（経過の和音）", group: 1, motion: true, runName: "6th⇄dim で1つのコードの中を動かす" }));
          cells.push({ cat: "Lage motion 6th-dim", p: ["4", "8", "8", "4", "4"].slice(0, 5), d: mel.map((m, k) => chordDeg([m, ...vs[k]])), authentic: true, lage5: true, ci });
          cells.push({ cat: "Lage motion 6th-dim slow", p: ["4.", "8", "4", "4"], d: mel.slice(0, 4).map((m, k) => chordDeg([m, ...vs[k]])), authentic: true, lage5: true, ci: ci.slice(0, 4) });
        });
      }
      // 3) 10度・3度の2声：スケールの3度下（10度は さらに1オクターブ下）を下に付けたライン
      const scl = LAGE_SCALES[q];
      for (const start of set0.map(x => x + 12)) {
        [-1, 1].forEach(dir => {
          const mel = [start]; for (let k = 1; k < 8; k++) mel.push((dir > 0 ? nextAbovePc : nextBelowPc)(mel[k - 1], scl, 0));
          const third = (m) => { const a = nextBelowPc(m, scl, 0); return a !== null ? nextBelowPc(a, scl, 0) : null; };
          const lo3 = mel.map(third);
          if (lo3.some(v => v === null)) return;
          [["10度", 12], ["3度", 0]].forEach(([nm, oct]) => {
            const p = ["8", "8", "8", "8", "8", "8", "4"];
            cells.push({ cat: `Lage motion ${nm}`, p, d: mel.slice(0, 7).map((m, k) => chordDeg([m, lo3[k] - oct])), authentic: true, lage5: true,
              ci: mel.slice(0, 7).map(() => ({ style: `${nm}の2声（スケールの3度下${oct ? "＋1オクターブ" : ""}）`, group: 1, motion: true })) });
          });
        });
      }
      return cells;
    };

    // ══ コードメロディ ══════════════════════════════════════════
    // テーマのメロディ（実音MIDI）とコード進行から、メロディを一番上に保ったコードメロディを作る
    // CM1 ベース＋メロディ ／ CM2 シェル ／ CM3 Drop 2・Drop 3・経過のdim ／ CM4 内声のライン・クリシェ
    const CM_LEVELS = [
      { id: 1, label: "CM1 ベース＋メロディ", desc: "コードが変わるところだけ、ベース音を一緒に弾く" },
      { id: 2, label: "CM2 シェル", desc: "コードの頭はベース＋ガイドトーン、強拍の長い音はガイドトーンを1つ下に足す" },
      { id: 3, label: "CM3 Drop 2・経過和音", desc: "表拍の音はほぼ全部3〜4声。コードにない短い音は経過のdim7、分数コードはベースを動かす" },
      { id: 4, label: "CM4 内声を動かす", desc: "CM3に加えて、長く伸びるメロディの下で内声を半音ずつ動かす（ライン・クリシェ）" }
    ];
    const CM_DUR_NAME = { 0.5: "8", 1: "4", 1.5: "4.", 2: "2", 3: "2.", 4: "1" };
    const slashBassPc = (name) => { const b = String(name || "").split("/")[1]; return b && PITCH_CLASSES[b] !== undefined ? PITCH_CLASSES[b] : null; };
    const cmChordAt = (chordStr, beat) => { const parts = String(chordStr || "").split(/\s+/).filter(Boolean); return parts.length === 2 && beat >= 2 ? parts[1] : parts[0]; };

    // メロディ音 m の下に置く和音の候補（m より低い音の配列と説明）
    const cmCandidates = (m, chordName, kind) => {
      const ch = parseChord(chordName), q = lageQuality(ch), r = ch.rootPc, rel = pcRel(m, r);
      const bassPc = slashBassPc(chordName);
      const bassRoot = bassPc !== null ? bassPc : r;
      const bassName = bassPc !== null ? String(chordName).split("/")[1] : String(chordName).match(/^[A-G][#b]?/)[0];
      const out = [];
      const basses = []; for (let b = 40; b <= 57; b++) if (pcRel(b, bassRoot) === 0 && b < m - 7) basses.push(b);
      const third = (q === "min" || q === "hdim" || q === "dim") ? 3 : 4;
      const sev = q === "maj" ? 11 : (q === "maj6" || q === "dim") ? 9 : 10;
      const guides = [third, sev].filter(g => g !== rel);
      const guideBelow = (g, lo, hi) => { const res = []; for (let v = m - 1; v >= m - 16; v--) if (pcRel(v, r) === g && m - v >= lo && m - v <= hi) res.push(v); return res; };
      if (kind === "none") return [{ notes: [], style: null }];
      if (kind === "bass") { basses.forEach(b => out.push({ notes: [b], style: `ベース（${bassName}）＋メロディ` })); return out.length ? out : [{ notes: [], style: null }]; }
      if (kind === "guide") {
        guides.forEach(g => guideBelow(g, 3, 12).forEach(v => out.push({ notes: [v], style: "ガイドトーン（3度か7度）を1つ下に" })));
        return out.length ? out : [{ notes: [], style: null }];
      }
      if (kind === "shellBass") {
        basses.forEach(b => guides.forEach(g => guideBelow(g, 3, 14).forEach(v => { if (v > b + 2) out.push({ notes: [v, b], style: `シェル（ベース${bassName}＋ガイドトーン）` }); })));
        if (out.length) return out;
        return cmCandidates(m, chordName, "bass");
      }
      if (kind === "passing") {
        // コードにない短い音：メロディを含むdim7で経過させる（バリー・ハリス）
        const dimSet = [0, 3, 6, 9].map(x => (rel + x) % 12);
        const v = drop2Under(m, dimSet, r);
        if (v) out.push({ notes: v, style: "経過のdim7（コードにない音をdimでつなぐ）" });
        guides.forEach(g => guideBelow(g, 3, 12).forEach(x => out.push({ notes: [x], style: "ガイドトーン（3度か7度）を1つ下に" })));
        out.push({ notes: [], style: null });
        return out;
      }
      // full：Drop 2／Drop 3／トライアド（分数コードはベースを足す）
      LAGE_SETS[q].forEach((set, i) => {
        let st = set, name = LAGE_SET_NAMES[q][i];
        if (!st.includes(rel)) return;
        const v2 = drop2Under(m, st, r);
        if (v2) out.push({ notes: v2, style: `Drop 2（${name}）` });
        const others = st.filter(x => x !== rel);
        const a = nextBelowPc(m, others, r), b = a !== null ? nextBelowPc(a, others, r) : null, c = b !== null ? nextBelowPc(b, others, r) : null;
        if (a !== null && b !== null && c !== null) out.push({ notes: [a, c, b - 12], style: `Drop 3（${name}）` });
      });
      if (!out.length) {   // メロディがテンション：近いコードトーンと入れ替えた形
        const base = LAGE_SETS[q][0];
        const dist = (x) => Math.min((x - rel + 12) % 12, (rel - x + 12) % 12);
        const near = base.reduce((b, x) => dist(x) < dist(b) ? x : b, base[0]);
        const st = base.map(x => x === near ? rel : x);
        const v2 = drop2Under(m, st, r);
        if (v2) out.push({ notes: v2, style: "Drop 2（メロディのテンションと入れ替え）" });
      }
      // トライアド（コードの3和音でメロディが一番上）
      const tri = q === "min" ? [0, 3, 7] : (q === "hdim" || q === "dim") ? [0, 3, 6] : [0, 4, 7];
      if (tri.includes(rel)) {
        const o = tri.filter(x => x !== rel);
        const a = nextBelowPc(m, o, r), b = a !== null ? nextBelowPc(a, o, r) : null;
        if (a !== null && b !== null) out.push({ notes: [a, b], style: "トライアド" });
      }
      // 分数コードやコードの頭：上の形の下にベース音を足す
      if (bassPc !== null || kind === "fullBass") {
        const withBass = [];
        out.forEach(c => basses.forEach(bs => { if (bs < Math.min(...c.notes) - 2 && c.notes.length <= 3) withBass.push({ notes: [...c.notes.slice(0, 2), bs], style: `${c.style.replace(/（.*/, "")}＋ベース${bassName}` }); }));
        if (bassPc !== null) return withBass.length ? withBass : cmCandidates(m, chordName, "shellBass");
        out.push(...withBass);
      }
      return out.length ? out : cmCandidates(m, chordName, "guide");
    };

    // 音の組（高い順）を弦に割り当てる候補。戻り値 [{ tab: [[弦,フレット]...], cost, center }]
    const cmFingerings = (notes) => {
      const res = [];
      const rec = (i, maxS, acc) => {
        if (i === notes.length) {
          const fr = acc.map(x => x[1]).filter(f => f > 0);
          const lo = fr.length ? Math.min(...fr) : 0, hi = fr.length ? Math.max(...fr) : 0;
          if (hi - lo > 4) return;
          let cost = (hi - lo) * 0.5 + Math.max(0, hi - 12) * 0.6 + Math.max(0, hi - 15) * 1.5 + Math.max(0, 1 - lo) * 0.3;
          for (let k = 1; k < acc.length; k++) cost += (acc[k - 1][0] - acc[k][0] - 1) * 0.8;   // 間の弦をミュートする手間
          if (acc[0][0] < 3 && notes.length > 1) cost += 2;                                   // メロディは3弦より上で
          res.push({ tab: acc.slice(), cost, center: fr.length ? (lo + hi) / 2 : acc[0][1] });
          return;
        }
        for (let s = maxS; s >= 0; s--) {
          const f = notes[i] - GUITAR_STRINGS[s];
          if (f < 0 || f > MAX_FRET) continue;
          acc.push([s, f]); rec(i + 1, s - 1, acc); acc.pop();
        }
      };
      rec(0, NUM_STRINGS - 1, []);
      return res.sort((a, b) => a.cost - b.cost).slice(0, 8);
    };

    const arrangeChordMelody = (melodyBars, chordList, level) => {
      const R = Math.random;
      const BEATS = { "8": .5, "4": 1, "4.": 1.5, "2": 2, "2.": 3, "1": 4, z8: .5, z4: 1, z2: 2, z1: 4 };
      // 1) メロディを曲全体の出来事の列にする（1小節2コードで伸ばしている音は、コードの変わり目で分ける）
      const evs = [];
      melodyBars.forEach((bar, bi) => {
        let beat = 0;
        bar.forEach(ev => {
          const dur = BEATS[ev[0]];
          const rest = ev[0].startsWith("z"), tieOut = String(ev[2] || "").includes("-");
          const two = String(chordList[bi] || "").split(/\s+/).filter(Boolean).length === 2;
          if (two && !rest && beat < 2 && beat + dur > 2) {
            evs.push({ bar: bi, beat, dur: 2 - beat, rest, midi: ev[1], tieOut: true, chord: cmChordAt(chordList[bi], beat) });
            evs.push({ bar: bi, beat: 2, dur: beat + dur - 2, rest, midi: ev[1], tieOut, chord: cmChordAt(chordList[bi], 2) });
          } else evs.push({ bar: bi, beat, dur, rest, midi: ev[1], tieOut, chord: cmChordAt(chordList[bi], beat) });
          beat += dur;
        });
      });
      const refresh = () => {
        let prevChord = null;
        evs.forEach((e, i) => {
          e.tieIn = i > 0 && evs[i - 1].tieOut && !evs[i - 1].rest && !e.rest;
          e.chordChange = !e.rest && e.chord !== prevChord;
          if (!e.rest) prevChord = e.chord;
          const ch = parseChord(e.chord);
          e.isCT = !e.rest && LAGE_SETS[lageQuality(ch)][0].includes(pcRel(e.midi, ch.rootPc));
        });
      };
      refresh();
      // タイの後ろ側でコードが変わる場合は弾き直す
      evs.forEach((e, i) => { if (e.tieIn && e.chordChange) { evs[i - 1].tieOut = false; e.tieIn = false; } });
      refresh();

      // 1b) 先取り（アンティシペーション）：次の小節頭のコードを、前の小節の4拍目裏で弾く
      if (level >= 3) {
        for (let i = 1; i < evs.length; i++) {
          const e = evs[i], p = evs[i - 1];
          if (e.rest || !e.chordChange || e.beat !== 0 || e.tieIn || p.bar !== e.bar - 1 || p.tieOut) continue;
          if (Math.abs(p.beat + p.dur - 4) > .01 || p.dur < 1) continue;
          if (R() > (level >= 4 ? .35 : .2)) continue;
          p.dur -= .5;
          evs.splice(i, 0, { bar: p.bar, beat: 3.5, dur: .5, rest: false, midi: e.midi, tieOut: true, chord: e.chord, anticip: true });
          i++;
        }
        // 先取りした音の後ろ側（次の小節の頭）はタイで伸ばすだけ
        let prevChord = null;
        evs.forEach((e, i) => {
          e.tieIn = i > 0 && evs[i - 1].tieOut && !evs[i - 1].rest && !e.rest;
          e.chordChange = !e.rest && !e.tieIn && e.chord !== prevChord;
          if (!e.rest) prevChord = e.chord;
          const ch = parseChord(e.chord);
          e.isCT = !e.rest && LAGE_SETS[lageQuality(ch)][0].includes(pcRel(e.midi, ch.rootPc));
        });
      }

      // 2) 和音の種類を決める
      evs.forEach(e => {
        if (e.rest || e.tieIn) { e.kind = "none"; return; }
        const onBeat = Math.abs(e.beat - Math.round(e.beat)) < .01;
        const strong = onBeat && (Math.round(e.beat) % 2 === 0);
        if (level === 1) e.kind = e.chordChange ? "bass" : "none";
        else if (level === 2) e.kind = e.chordChange ? "shellBass" : (strong && e.dur >= 1 ? "guide" : "none");
        else {
          if (e.chordChange) e.kind = "fullBass";
          else if (!e.isCT && e.dur <= 1) e.kind = "passing";
          else if (strong || e.dur >= 1.5) e.kind = "full";
          else e.kind = onBeat ? "guide" : "none";
        }
      });

      // 3) 候補（和音×運指）から、指の移動が少ない並びを曲全体で選ぶ（毎回少し揺らして、生成ごとに違う編曲にする）
      const noise = level >= 3 ? 1.6 : 1.0;
      const playable = evs.filter(e => !e.rest && !e.tieIn);
      const layers = playable.map(e => {
        const cands = [];
        cmCandidates(e.midi, e.chord, e.kind).forEach(c => {
          const notes = [e.midi, ...[...c.notes].sort((a, b) => b - a)].filter((v, k, arr) => k === 0 || (v < arr[k - 1] && v >= 40));
          // CM3以上は、テンションを含む形（入れ替え形・オルタード）を少し優先してジャズらしくする
          const jazz = level >= 3 && c.style && !/基本形|シェル|ベース（/.test(c.style) ? -0.6 : 0;
          const nz = R() * noise;
          cmFingerings(notes).forEach(fg => cands.push({ notes, style: c.style, tab: fg.tab, cost: fg.cost + jazz + nz + (notes.length === 1 && e.kind !== "none" ? 3 : 0), center: fg.center }));
        });
        return cands.length ? cands : cmFingerings([e.midi]).map(fg => ({ notes: [e.midi], style: null, tab: fg.tab, cost: fg.cost, center: fg.center }));
      });
      const best = [];
      let prev = layers.length ? layers[0].map(c => ({ total: c.cost + Math.abs(c.center - 7) * 0.2, from: -1 })) : [];
      const back = [prev];
      for (let i = 1; i < layers.length; i++) {
        const cur = layers[i].map(c => {
          let bt = Infinity, bf = 0;
          layers[i - 1].forEach((p, j) => { const t = prev[j].total + c.cost + Math.abs(c.center - p.center) * 0.45; if (t < bt) { bt = t; bf = j; } });
          return { total: bt, from: bf };
        });
        back.push(cur); prev = cur;
      }
      if (layers.length) {
        let j = prev.reduce((bi, x, k, arr) => x.total < arr[bi].total ? k : bi, 0);
        for (let i = layers.length - 1; i >= 0; i--) { best[i] = layers[i][j]; j = back[i][j].from; }
      }
      playable.forEach((e, i) => { e.pick = { ...best[i] }; });

      // 3b) 次のコードへの平行移動：コードが変わる直前の短い音は、次の和音を半音・全音ずらした形にする
      if (level >= 3) {
        playable.forEach((e, i) => {
          const nx = playable[i + 1];
          if (!nx || !nx.chordChange || e.chordChange || e.dur > 1 || nx.pick.notes.length < 3) return;
          const d = e.midi - nx.midi;
          if (Math.abs(d) < 1 || Math.abs(d) > 2 || Math.abs(nx.beat + nx.bar * 4 - (e.beat + e.bar * 4 + e.dur)) > .01) return;
          if (R() > .6) return;
          const notes = nx.pick.notes.map(v => v + d);
          if (Math.min(...notes) < 40) return;
          const fg = cmFingerings(notes).sort((a, b) => (a.cost + Math.abs(a.center - nx.pick.center)) - (b.cost + Math.abs(b.center - nx.pick.center)))[0];
          if (!fg) return;
          e.pick = { notes, tab: fg.tab, center: fg.center, style: `次の和音を${Math.abs(d) === 1 ? "半音" : "全音"}${d > 0 ? "上" : "下"}からスライドさせる` };
        });
      }
      evs.forEach((e, i) => { if (e.tieIn) e.pick = evs[i - 1].pick; });

      // 4) 隙間のフィル：伸ばしている音や休符のところに、次のメロディ音へ向かう和音のフレーズを入れる
      const FILL_RHYTHMS = {
        1: [["8", "8"], ["4"]], 1.5: [["8", "8", "8"], ["4", "8"]],
        2: [["4", "4"], ["8", "8", "4"], ["4.", "8"], ["8", "8", "8", "8"]],
        2.5: [["8", "4", "4"], ["4", "8", "8", "8"], ["8", "8", "8", "4"]],
        3: [["4", "4", "4"], ["8", "8", "4", "4"], ["4", "8", "8", "4"], ["4.", "8", "4"]],
        3.5: [["8", "4", "4", "4"], ["8", "8", "8", "4", "4"]]
      };
      const pick1 = (a) => a[Math.floor(R() * a.length)];
      // フィルは単音か2声まで（メロディの邪魔をしないように）
      const FILL_NAMES = { single: "単音のライン（6thディミニッシュ・スケール）", "3rds": "3度の2声", "6ths": "6度の2声", "10ths": "10度の2声" };
      // ジャズのフレーズ（クリスチャン・パーカー・ラーゲなどの辞書）の後ろの部分を、隙間の長さだけ切り出して使う
      const PH_BEATS = { "8": .5, "4": 1, "4.": 1.5, "2": 2, "2.": 3, "2..": 3.5, "2.5": 2.5, "1": 4, "16": .25, "trip8": 1/3, "trip16": 1/6, z8: .5, z4: 1, z2: 2, z1: 4, z16: .25 };
      const makePhraseFill = (bar, startBeat, beats, target, prevCenter) => {
        const chName = cmChordAt(chordList[bar], startBeat);
        if (cmChordAt(chordList[bar], startBeat + beats - .01) !== chName) return null;      // 隙間の途中でコードが変わる場合は使わない
        const ch = parseChord(chName), qual = chordQuality(chName), deg = getChordDegrees(ch);
        const lv2 = MODES.find(m => m.id === "LV2");
        const pool = PHRASE_DICTIONARY.filter(c => (lv2.match(c) || (c.cat.includes("Lage") && !c.d.some(Array.isArray))) &&
          !c.span2 && !c.q2 && !c.d2 && !c.d.some(Array.isArray) && (!c.q || c.q.includes(qual)) &&
          (!c.onlyV7 || ch.isV7) && (!c.onlyMajor || ch.isMajor) && (!c.onlyMinor || ch.isMinor));
        const tries = [];
        for (let t = 0; t < 40 && pool.length; t++) {
          const c = pool[Math.floor(R() * pool.length)];
          // フレーズの中で、終わりからちょうど beats 拍のところで始まる音を探す
          let b = 0, ni = 0; const evs2 = [];
          c.p.forEach(dn => { const isR = dn.startsWith("z"); evs2.push({ dn, beat: b, dur: PH_BEATS[dn] || .5, rest: isR, d: isR ? null : c.d[ni] }); if (!isR) ni++; b += PH_BEATS[dn] || .5; });
          const total = b;
          const k0 = evs2.findIndex(x => Math.abs(x.beat - (total - beats)) < .01 && !x.dn.startsWith("trip") || (Math.abs(x.beat - (total - beats)) < .01 && Math.abs(x.beat - Math.round(x.beat)) < .01));
          if (k0 < 0) continue;
          const seg = evs2.slice(k0);
          const noteEvs = seg.filter(x => !x.rest);
          if (noteEvs.length < 2) continue;
          const offs = noteEvs.map(x => deg[x.d] !== undefined ? deg[x.d] : 0);
          // 最後の音が次のメロディ音の半音・全音隣になるオクターブを選ぶ
          for (let oct = 3; oct <= 6; oct++) {
            const root = ch.rootPc + oct * 12;
            const ms = offs.map(o => root + o);
            if (Math.min(...ms) < 52 || Math.max(...ms) > 75) continue;
            const gap = Math.abs(ms[ms.length - 1] - target);
            const avg = ms.reduce((a, v) => a + v, 0) / ms.length;
            // 次のメロディ音の隣に着地＋メロディと近い音域（大きく飛ばない）を優先
            const sc = ((gap === 1 || gap === 2) ? 0 : gap === 0 ? 6 : gap) + Math.abs(avg - target) * 0.15 + (Math.max(...ms) - Math.min(...ms) > 14 ? 1.5 : 0);
            tries.push({ c, seg, ms, score: sc + R() * .8 });
          }
        }
        if (!tries.length) return null;
        tries.sort((a, b) => a.score - b.score);
        const bestT = tries[0];
        if (bestT.score > 4) return null;
        const out = []; let cen = prevCenter, mi = 0, beat = startBeat;
        bestT.seg.forEach(x => {
          if (x.rest) { out.push({ bar, beat, dur: x.dur, dn: x.dn, rest: true }); beat += x.dur; return; }
          const m = bestT.ms[mi++];
          const fg = cmFingerings([m]).sort((a, b) => (a.cost * .6 + Math.abs(a.center - cen)) - (b.cost * .6 + Math.abs(b.center - cen)))[0];

                const activeChord = measureBeat < 2 - 1e-6 ? chord1 : chord2;

                if (isRest) {
                  measureAbc += prefix + abcDur;
                  measureRests.push({ beatPos: measureBeat, dur: durBeat });
                } else {
                  const isChordEv = Array.isArray(trebleMidi);
                  const clampReal = (tm) => Math.max(MIN_BASS_MIDI, Math.min(MAX_BASS_MIDI, tm + TRANS_OFFSET));
                  const realMidi = clampReal(topMidi(trebleMidi));
                  const writtenMidi = realMidi + 12;
                  let abcNote;
                  if (isChordEv) {
                    // 和音（ダブルストップ等）：低い音から順に [ ] でまとめる
                    const order = trebleMidi.map((m, i) => [m, (chordSpells && chordSpells[i]) || undefined]).sort((a, b) => a[0] - b[0]);
                    abcNote = "[" + order.map(([m, sp]) => midiToAbcByKey(clampReal(m) + 12, currentSong.key, measureAccRef, sp || undefined)).join("") + "]";
                  } else {
                    abcNote = midiToAbcByKey(writtenMidi, currentSong.key, measureAccRef, spell);
                  }
                  measureAbc += prefix + abcNote + abcDur + (tieOut ? "-" : "");
                  if (tiedTail) measureAbc += midiToAbcByKey(writtenMidi, currentSong.key, measureAccRef, spell) + "";

                  if (isTieTail) {
                    // タイの後ろ側の音：TABでは再度弾かない。歌詞（度数）行は位置合わせのため「*」でスキップ
                    lineWords += "* ";
                    const ttFixed = (currentSong.transcriptionTab && currentSong.transcriptionTab[globalMeasureIdx]) ? currentSong.transcriptionTab[globalMeasureIdx][evIdx] : null;
                    measureTieTails.push({ beatPos: measureBeat, dur: durBeat, midi: realMidi, fixed: ttFixed });
                  } else {
                    const label = getDegreeLabelFromMidi(realMidi, activeChord);
                    lineWords += label + " ";
                    if (tiedTail) lineWords += "* ";

                    measureNotesData.push({
                      beatPos: measureBeat,
                      dur: durBeat,
                      label: currentSong.noDegrees ? null : label,
                      midi: realMidi,
                      isHarm: false,
                      chordMinMidi: MIN_BASS_MIDI,
                      chordMaxMidi: MAX_BASS_MIDI,
                      chordExtra: isChordEv ? trebleMidi.map(clampReal).filter(m => m !== realMidi) : null,
                      chordInfo: (currentSong.transcriptionInfo && currentSong.transcriptionInfo[globalMeasureIdx] && currentSong.transcriptionInfo[globalMeasureIdx][evIdx]) ||
                        (isChordEv && !currentSong.isChordMelody ? { style: "原曲の和音", runName: null, group: "t" + evIdx } : null), chordRef: activeChord,
                      parent: parentAt(globalMeasureIdx, measureBeat),
                      fixedTab: (currentSong.transcriptionTab && currentSong.transcriptionTab[globalMeasureIdx]) ? currentSong.transcriptionTab[globalMeasureIdx][evIdx] : null

                  }
                }

                if (Math.abs(measureBeat - Math.round(measureBeat)) < 0.01) {

              });
            } else {
              // 2小節フレーズの後半を予約済みなら、その小節の候補探索は不要

              let pool = spanNow ? [spanNow.cell] : PHRASE_DICTIONARY.filter(cell => {
                // 2小節ii-Vフレーズ：この小節が m7（1コード）で、次の小節が完全4度上の7th（1コード）のときだけ
                if (cell.span2) {
                  if (c2Str || globalMeasureIdx + 1 >= measureCount) return false;
                  const nxRaw = chords[globalMeasureIdx + 1];
                  if (!nxRaw) return false;
                  const nxParts = nxRaw.split(/\s+/).filter(Boolean);
                  if (nxParts.length !== 1) return false;
                  const nx = parseChord(nxParts[0]);

                  const vh1 = getValidHarmonicsForChord(chord1).filter(h => h.priority >= 2 && h.midi <= 62);

                  const uniquePcs1 = new Set(vh1.map(h => h.pc));

                }

                }

                return true;
              });

              // Lv3：バリー・ハリスの6thディミニッシュ・スケールから、その場でラインを作る

              // Lv3+：メロディックマイナー／ハーモニックマイナー（Lv5 でもラインの元にする）

                // 次の「違う」コード（同じコードが続くときは先を見る。最後の小節は頭に戻る）
                let nx = null;
                const lastName = (c2Str || c1Str);
                for (let k = 1; k <= chords.length && !nx; k++) {
                  const nxR = chords[(globalMeasureIdx + k) % chords.length];
                  const first = nxR ? nxR.split(/\s+/).filter(Boolean)[0] : null;
                  if (first && first !== lastName) nx = parseChord(first);
                }
                let msPool = makeMinorScaleCells(chord1, chord2, !!c2Str, useRests, nx, msFocus);
                if (!msPool.length && msFocus !== "both") msPool = makeMinorScaleCells(chord1, chord2, !!c2Str, useRests, nx, "both");

              }
              // Lv4：トライアド・ペア

              }
              // Lv5：ラインの元は Lv2（クリスチャン）・Lv3・Lv4 とラーゲの実フレーズ。和音はあとから足す
              if (category === "LV5" && !spanNow) {
                const shuffle = (a) => a.sort(() => Math.random() - .5);
                pool = [...pool,
                  ...shuffle(makeBarryHarrisCells(chord1, chord2, !!c2Str, true)).slice(0, 8),
                  ...shuffle(makeTriadPairCells(chord1, chord2, !!c2Str, true)).slice(0, 8),
                  ...lv5MinorCells,
                  // 和音そのものが動くフレーズ（転回形の連続、6th⇄dim、10度・3度の2声）
                  ...(c2Str ? [] : shuffle(makeLageMotionCells(chord1)).slice(0, 6))];
              }

              // Lv1：Jazz Phrase のリズム（音の割り方）＋トライアドの音で作ったフレーズを候補に加える
              if (category === "LV1" && borrowRhythm && !spanNow && !c2Str) {
                const lv2 = MODES.find(m => m.id === "LV2");
                // 8分音符が並ぶだけのフレーズはリズムの手本にならないので除く（休符・4分・3連・16分を含むものだけ）
                const donors = PHRASE_DICTIONARY.filter(c => lv2.match(c) && !c.span2 && !c.q2 && !c.d2 &&
                  !c.d.some(Array.isArray) && c.d.length >= 3 && (allow16th || !hasSixteenth(c)) && c.p.some(x => x !== "8"));
                const deg1 = getChordDegrees(chord1);
                const picks = [];
                for (let k = 0; k < 24 && donors.length && picks.length < 12; k++) {
                  const tc = makeTriadFromDonor(donors[Math.floor(Math.random() * donors.length)], chord1, deg1);

              }

              if (pool.length === 0) {

                // 万が一条件が厳しすぎて見つからない場合の最終フォールバック
