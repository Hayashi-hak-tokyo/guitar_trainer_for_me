  <style>
    .abcjs-css-warning { display: none !important; }
    
    /* タイトル・五線・音符・記号をくっきりと濃く描画 */
    .abcjs-title { fill: #0f172a !important; font-weight: 800 !important; font-size: 20px !important; }
    .abcjs-note { fill: #0f172a !important; opacity: 1 !important; }
    .abcjs-rest { fill: #0f172a !important; opacity: 1 !important; }
    .abcjs-clef { fill: #0f172a !important; opacity: 1 !important; }
    .abcjs-key-signature { fill: #0f172a !important; opacity: 1 !important; }
    .abcjs-time-signature { fill: #0f172a !important; opacity: 1 !important; }
    .abcjs-accidental { fill: #0f172a !important; opacity: 1 !important; }
    .abcjs-bar { stroke: #0f172a !important; opacity: 1 !important; }
    .abcjs-beam-elem { fill: #0f172a !important; opacity: 1 !important; }
    
    /* 五線の横線をくっきりと太く表示 */
    .abcjs-staff, path.abcjs-staff, line.abcjs-staff, .abcjs-staff-line { 
      fill: #0f172a !important; 
      stroke: #0f172a !important; 
      opacity: 1 !important; 
    }
    
    /* 再生時のノートハイライト */
    .abcjs-highlight { fill: #d97706 !important; stroke: #d97706 !important; }
    .abcjs-tempo { display: none !important; }

    /* コード名・度数注記 */
    .abcjs-chord { font-size: 15px !important; font-weight: 800 !important; fill: #0f172a !important; }
    .abcjs-lyric { font-size: 11.5px !important; font-weight: 700 !important; fill: #b45309 !important; font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important; }

    #paper { padding-bottom: 20px; }
    #paper svg { 
      overflow: visible !important; 
      width: 100% !important;
      height: auto !important;
    }

    /* ABCJS内蔵オーディオコントローラーのスタイル（添付ファイル準拠） */
    .abcjs-inline-audio { margin: 0; padding: 4px; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .abcjs-inline-audio .abcjs-btn {
       background-color: #ffffff !important;
       border: 1px solid #cbd5e1 !important;
       border-radius: 8px !important;
       color: #334155 !important;
       width: 36px !important;
       height: 36px !important;
       cursor: pointer;
       display: inline-flex !important;
       align-items: center;
       justify-content: center;
       margin: 0 3px;
       padding: 0 !important;
       transition: all 0.15s ease-in-out !important;
    }
    .abcjs-inline-audio .abcjs-btn:hover { background-color: #f1f5f9 !important; }
    .abcjs-inline-audio .abcjs-btn svg { width: 18px !important; height: 18px !important; fill: #334155 !important; }

    .abcjs-inline-audio .abcjs-btn.abcjs-pushed {

       border-color: #b45309 !important;
       color: #ffffff !important;
       box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.25) !important;
    }
    .abcjs-inline-audio .abcjs-btn.abcjs-pushed svg { fill: #ffffff !important; }

    const parseChord = (chordStr) => {
      if (!chordStr) return { name: "Cmaj7", rootPc: 0, isMajor: true, roots: [36, 48] };
      const match = chordStr.match(/^[A-G][#b]?/);
      const root = match ? match[0] : 'C';
      const rootPc = PITCH_CLASSES[root] || 0;
      const type = chordStr.substring(root.length).split('/')[0];   // 分数コードのベース音は無視
      
      const isMinor = type.includes('m') && !type.includes('maj') && !type.includes('dim');
      const isDim = type.includes('dim') || type.includes('m7b5') || type.includes('°');
      const isMajor = !isDim && (type.includes('maj') || type.includes('M7') || type.includes('△') || type === '' || (type === '6' || type === '69' || type === '6/9'));
      const isV7 = (type.includes('7') || /^(9|11|13)/.test(type)) && !isMinor && !isMajor && !isDim;

      // ギターの中音域（4弦〜2弦あたり）にルートを置く
      let roots = [];
      for (let oct of [4, 5]) {
         let midi = rootPc + (oct * 12);
         if (midi >= SOLO_MIN_MIDI && midi <= SOLO_MAX_MIDI - 12) {
             roots.push(midi);
         }
      }
      if (roots.length === 0) roots = [48 + rootPc];

      return { name: chordStr, rootPc, isMajor, isMinor, isV7, isDim, roots };
    };

    // コード種別（フレーズの適合判定用）: maj / dom / min / hdim(m7b5) / dim
    const chordQuality = (name) => {
      const m = String(name || '').match(/^[A-G][#b]?/);
      const t = String(name || '').substring(m ? m[0].length : 0).split('/')[0];
      if (t.includes('dim')) return 'dim';
      if (t.includes('m7b5') || t.includes('ø')) return 'hdim';
      if (t.includes('maj') || t.includes('M7') || t.includes('△')) return 'maj';
      if (t.includes('m')) return 'min';
      if (t.includes('7') || /^(9|11|13)/.test(t)) return 'dom';
      return 'maj';
    };

    const getChordDegrees = (chord) => {
      const third = chord.isMinor || chord.isDim ? 3 : 4;
      const seventh = chord.isMajor ? 11 : 10;
      const semis = {}; // 's5' = ルートから+5半音（Donna Lee抽出フレーズ用の絶対オフセット）
      for (let n = -48; n <= 60; n++) semis['s' + n] = n;
      return {
        ...semis,
        'R': 0, 'b2': 1, '2': 2, 'b9': 1, '9': 2, '#9': 3,
        'm3': 3, 'M3': 4, '3': third,
        '4': 5, '11': 5, '#4': 6, '#11': 6, 'b5': 6,
        '5': chord.isDim ? 6 : 7, '#5': 8, 'b13': 8, '6': 9, '13': 9,
        'bb7': 9, 'm7': 10, 'M7': 11, '7': seventh,
        // 1オクターブ上 (Drop2の10度やテンション)
        'R8': 12, '2_8': 14, '9_8': 14, 'b9_8': 13, '#9_8': 15,
        'm3_8': 15, 'M3_8': 16, '38': third + 12, '10': third + 12,
        '4_8': 17, 'b5_8': 18, '58': (chord.isDim ? 6 : 7) + 12, '6_8': 21, '13_8': 21, '78': seventh + 12,
        'm7_8': 22,
        // 2オクターブ上
        'R15': 24, 'b9_15': 25, '2_15': 26, 'm3_15': 27, '3_15': third + 24,
        '4_15': 29, '5_15': (chord.isDim ? 6 : 7) + 24,
        // 1オクターブ下
        'R_down': -12, 'b9_down': -11, '2_down': -10, 'm3_down': -9, 'M3_down': -8,
        '3_down': third - 12, '4_down': 5 - 12, 'b5_down': -6, '5_down': (chord.isDim ? 6 : 7) - 12, '6_down': -3, '7_down': seventh - 12,

    const formatDegreeLabel = (deg, isHarm) => {
      let clean = deg
        .replace('_down', '')
        .replace('_15', '')
        .replace('_8', '')
        .replace('R15', 'R')
        .replace('R8', 'R')
        .replace('38', '3')
        .replace('58', '5')
        .replace('78', '7');
      return isHarm ? `<${clean}>` : clean;
    };

    // 実音MIDIとコードから度数表記を算出（完コピ譜面用）
    const getDegreeLabelFromMidi = (realMidi, chord) => {
      const iv = ((realMidi - chord.rootPc) % 12 + 12) % 12;
      if (iv === 0) return 'R';
      if (iv === 1) return 'b9';
      if (iv === 2) return '2';
      if (iv === 3) return (chord.isMajor || chord.isV7) ? '#9' : 'm3';
      if (iv === 4) return (chord.isMinor || chord.isDim) ? 'M3' : '3';
      if (iv === 5) return '4';
      if (iv === 6) return chord.isDim ? 'b5' : '#4';
      if (iv === 7) return '5';
      if (iv === 8) return 'b13';
      if (iv === 9) return chord.isDim ? 'bb7' : '6';
      if (iv === 10) return 'm7';
      if (iv === 11) return 'M7';
      return 'R';

    // 4弦ベースのナチュラル・ハーモニクス定義（実音MIDIとピッチクラス）

      { stringIdx: 2, fret: "<4>",  fretNum: 4,  midi: 66, pc: 6 },  // 2弦4F = F#4/Gb4
      { stringIdx: 3, fret: "<4>",  fretNum: 4,  midi: 71, pc: 11 }  // 1弦4F = B4 (シ)
    ];

    // 指定したコード上で音楽的に成立するナチュラル・ハーモニクス一覧とその度数を返す
    const getValidHarmonicsForChord = (chord) => {
      const valid = [];
      NATURAL_HARMONICS.forEach(h => {
        const interval = (h.pc - chord.rootPc + 12) % 12;
        let degLabel = null;
        let priority = 0;

        if (interval === 0) { degLabel = 'R'; priority = 3; }
        else if (interval === 2) { degLabel = '9'; priority = 2; }
        else if (interval === 3 && (chord.isMinor || chord.isDim)) { degLabel = 'm3'; priority = 3; }
        else if (interval === 4 && (chord.isMajor || chord.isV7)) { degLabel = '3'; priority = 3; }
        else if (interval === 5 && (chord.isMinor || chord.isDim)) { degLabel = '11'; priority = 2; }
        else if (interval === 6 && chord.isDim) { degLabel = 'b5'; priority = 3; }
        else if (interval === 6 && (chord.isMajor || chord.isV7)) { degLabel = '#11'; priority = 1; }
        else if (interval === 7 && !chord.isDim) { degLabel = '5'; priority = 3; }
        else if (interval === 9 && (chord.isMajor || chord.isMinor || chord.isV7)) { degLabel = '6'; priority = 2; }
        else if (interval === 10 && !chord.isMajor) { degLabel = 'm7'; priority = 3; }
        else if (interval === 11 && chord.isMajor) { degLabel = 'M7'; priority = 3; }

        if (degLabel) {
          valid.push({ ...h, degLabel, priority });
        }
      });
      return valid;
    };

    // メカニカル・シーケンス生成ヘルパー（任意の構成音から開始可能にしてコード間の跳躍を最小化）
    const buildMechanicalPhrases = () => {
      const phrases = [];
      const p16 = Array(16).fill("16");
      const p8 = Array(8).fill("8");
      const steps16 = [0,1,2,3, 1,2,3,4, 2,3,4,5, 3,4,5,6];
      const steps8  = [0,1,2,3, 1,2,3,4];

      // メジャーペンタトニック (R, 2, 3, 5, 6)
      const majScale = ['3_down', '5_down', '6_down', 'R', '2', '3', '5', '6', 'R8', '2_8', '38', '58', '6_8', 'R15', '2_15', '3_15'];
      for (let s = 0; s < 5; s++) {
        phrases.push({ cat: "Mechanical Maj Up", p: p16, d: steps16.map(o => majScale[s + o]), onlyMajor: true });
        phrases.push({ cat: "Mechanical Maj Up 8th", p: p8, d: steps8.map(o => majScale[s + o]), onlyMajor: true });
      }
      for (let s = 6; s <= 10; s++) {
        phrases.push({ cat: "Mechanical Maj Down", p: p16, d: steps16.map(o => majScale[s - o]), onlyMajor: true });
        phrases.push({ cat: "Mechanical Maj Down 8th", p: p8, d: steps8.map(o => majScale[s - o]), onlyMajor: true });
      }

      // マイナーペンタトニック (R, m3, 4, 5, m7)
      const minScale = ['m3_down', '4_down', '5_down', 'm7_down', 'R', 'm3', '4', '5', 'm7', 'R8', 'm3_8', '4_8', '58', 'm7_8', 'R15', 'm3_15'];
      for (let s = 0; s < 5; s++) {
        phrases.push({ cat: "Mechanical Min Up", p: p16, d: steps16.map(o => minScale[s + o]), onlyMinor: true });
        phrases.push({ cat: "Mechanical Min Up 8th", p: p8, d: steps8.map(o => minScale[s + o]), onlyMinor: true });
      }
      for (let s = 6; s <= 10; s++) {
        phrases.push({ cat: "Mechanical Min Down", p: p16, d: steps16.map(o => minScale[s - o]), onlyMinor: true });
        phrases.push({ cat: "Mechanical Min Down 8th", p: p8, d: steps8.map(o => minScale[s - o]), onlyMinor: true });
      }

      // ドミナントV7：ディミニッシュ① (3, 5, m7, b9)
      const dimScale = ['3_down', '5_down', 'm7_down', 'b9', '3', '5', 'm7', 'b9_8', '38', '58', 'm7_8', 'b9_15', '3_15'];
      for (let s = 0; s < 4; s++) {
        phrases.push({ cat: "Mechanical V7 Dim Up", p: p16, d: steps16.map(o => dimScale[s + o]), onlyV7: true });
        phrases.push({ cat: "Mechanical V7 Dim Up 8th", p: p8, d: steps8.map(o => dimScale[s + o]), onlyV7: true });
      }
      for (let s = 6; s <= 9; s++) {
        phrases.push({ cat: "Mechanical V7 Dim Down", p: p16, d: steps16.map(o => dimScale[s - o]), onlyV7: true });
        phrases.push({ cat: "Mechanical V7 Dim Down 8th", p: p8, d: steps8.map(o => dimScale[s - o]), onlyV7: true });
      }

      // ドミナントV7：ディミニッシュ② (R, m3, b5, 6) - オルタード/コンディミ系テンション(#9, #11, 13)
      const dimScale2 = ['m3_down', 'b5_down', '6_down', 'R', 'm3', 'b5', '6', 'R8', 'm3_8', 'b5_8', '6_8', 'R15', 'm3_15'];
      for (let s = 0; s < 4; s++) {
        phrases.push({ cat: "Mechanical V7 Dim2 Up", p: p16, d: steps16.map(o => dimScale2[s + o]), onlyV7: true });
        phrases.push({ cat: "Mechanical V7 Dim2 Up 8th", p: p8, d: steps8.map(o => dimScale2[s + o]), onlyV7: true });
      }
      for (let s = 6; s <= 9; s++) {
        phrases.push({ cat: "Mechanical V7 Dim2 Down", p: p16, d: steps16.map(o => dimScale2[s - o]), onlyV7: true });
        phrases.push({ cat: "Mechanical V7 Dim2 Down 8th", p: p8, d: steps8.map(o => dimScale2[s - o]), onlyV7: true });

      return phrases;
    };

    // チャーリー・パーカー「Donna Lee」の実譜面から抽出したフレーズ（コードルートからの半音オフセット "sN" で記録）
    // q: 対象コード種別 / q2: 2つ目のコード種別（ii-V小節用） / 出典：小節番号とコード

      { cat: "Parker Donna Lee 3", p:["trip8","trip8","trip8","8","8","8","8","8","8"], d:["s8","s10","s8","s7","s5","s4","s7","s10","s14"], q:["dom"], authentic:true }, // bar 3 Bb7
      { cat: "Parker Donna Lee 4", p:["8","8","z4","z8","4","8"], d:["s9","s7","s6","s4"], q:["dom"], authentic:true }, // bar 4 Bb7
      { cat: "Parker Donna Lee 5", p:["8","8","8","8","8","8","8","8"], d:["s17","s11","s12","s15","s19","s22","s26","s29"], q:["min"], authentic:true }, // bar 5 Bbm7
      { cat: "Parker Donna Lee 6", p:["8","8","8","8","8","8","8","8"], d:["s22","s14","s17","s21","s20","s13","s12","s10"], q:["dom"], authentic:true }, // bar 6 Eb7
      { cat: "Parker Donna Lee 7", p:["8","8","8","8","4","8","8"], d:["s4","s7","s11","s14","s12","s7","s9"], q:["maj"], authentic:true }, // bar 7 Abmaj7
      { cat: "Parker Donna Lee 9", p:["2.5","8","8","8"], d:["s14","s12","s11","s9"], q:["maj"], authentic:true }, // bar 9 Dbmaj7

        const chordStr = chordList[bi];

        if (!parts.length || parts.length > 2 || (parts.length === 2 && !opts.allowTwo)) return;   // 2コードの小節は allowTwo のときだけ

          const ev = bar[ei];

    const resolveDuration = (durType, tripCounter) => {
      let durBeat = 0.5, abcDur = "", isRest = false, prefix = "", tiedTail = false;
      if (durType === "z8") { isRest = true; durBeat = 0.5; abcDur = "z"; }
      else if (durType === "z4") { isRest = true; durBeat = 1.0; abcDur = "z2"; }

      else if (durType === "z16") { isRest = true; durBeat = 0.25; abcDur = "z/2"; }
      else if (durType === "4") { durBeat = 1.0; abcDur = "2"; }
      else if (durType === "4.") { durBeat = 1.5; abcDur = "3"; }
      else if (durType === "2.5") { durBeat = 2.5; abcDur = "4-"; tiedTail = true; } // 2分音符＋タイ8分音符

      else if (durType === "2.") { durBeat = 3.0; abcDur = "6"; }
      else if (durType === "2..") { durBeat = 3.5; abcDur = "7"; }
      else if (durType === "1") { durBeat = 4.0; abcDur = "8"; }
      else if (durType === "q8") { // 5連符（8分×5＝2拍）

      else if (durType === "16") { durBeat = 0.25; abcDur = "/2"; }
      else if (durType === "32") { durBeat = 0.125; abcDur = "/4"; }
      else if (durType === "trip8") {

        if (tripCounter === 0) prefix = "(3";
        tripCounter = (tripCounter + 1) % 3;
      } else if (durType === "trip16") {
        durBeat = 1 / 6; abcDur = "/2";
        if (tripCounter === 0) prefix = "(3";
        tripCounter = (tripCounter + 1) % 3;

    // 重み付きランダム選択（Donna Lee由来フレーズを優先）
    const pickWeighted = (list) => {
      const w = list.map(c => (c.cell && typeof c.cell.w === "number") ? c.cell.w : ((c.cell && c.cell.authentic) ? DONNA_WEIGHT : 1));
      let r = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
      return list[list.length - 1];

    const midiToAbcByKey = (midi, keySig, measureAccRef, spell) => {
      const flats = KEY_FLATS[keySig] || [];
      const sharps = KEY_SHARPS[keySig] || [];

      const pitchClass = midi % 12;
      const oct = Math.floor(midi / 12);

      let baseName = "";
      let targetState = "natural";

      switch (pitchClass) {
        case 0:  baseName = "C"; targetState = "natural"; break;
        case 1:  baseName = useFlat ? "D" : "C"; targetState = useFlat ? "flat" : "sharp"; break;
        case 2:  baseName = "D"; targetState = "natural"; break;
        case 3:  baseName = useFlat ? "E" : "D"; targetState = useFlat ? "flat" : "sharp"; break;
        case 4:  baseName = "E"; targetState = "natural"; break;
        case 5:  baseName = "F"; targetState = "natural"; break;
        case 6:  baseName = useFlat ? "G" : "F"; targetState = useFlat ? "flat" : "sharp"; break;
        case 7:  baseName = "G"; targetState = "natural"; break;
        case 8:  baseName = useFlat ? "A" : "G"; targetState = useFlat ? "flat" : "sharp"; break;
        case 9:  baseName = "A"; targetState = "natural"; break;
        case 10: baseName = useFlat ? "B" : "A"; targetState = useFlat ? "flat" : "sharp"; break;
        case 11: baseName = "B"; targetState = "natural"; break;

      const abcOctave = Math.floor(midi / 12) - 1; // MIDI 60 => 4, MIDI 48 => 3, MIDI 36 => 2, MIDI 24 => 1
      if (abcOctave <= 1) abc = baseName + ",,,";
      else if (abcOctave === 2) abc = baseName + ",,";
      else if (abcOctave === 3) abc = baseName + ",";
      else if (abcOctave === 4) abc = baseName;
      else if (abcOctave === 5) abc = baseName.toLowerCase();
      else if (abcOctave === 6) abc = baseName.toLowerCase() + "'";
      else abc = baseName.toLowerCase() + "''";

      const defaultState = flats.includes(baseName) ? "flat" : (sharps.includes(baseName) ? "sharp" : "natural");
      const key = baseName + oct;
      const currentState = measureAccRef[key] !== undefined ? measureAccRef[key] : defaultState;

      let prefix = "";
      if (targetState !== currentState) {

        else if (targetState === "sharp") prefix = "^";
        else if (targetState === "natural") prefix = "=";

    // 4弦ベースTABフレット計算 (最大6フレット圏内のボックスポジション＆2ボックス連結最適化)
    const getTabForNote = (midi, isHarm, boxStart, forceString = -1, prevTab = null) => {

      for (let s = NUM_STRINGS - 1; s >= 0; s--) {
        const fret = midi - BASS_STRINGS[s];

          if (fret === 0) {

            // 他に弾ける場所がない音（E1）だけは開放弦を許容する

            const strDiff = Math.abs(s - prevTab.stringIdx);
            if (strDiff > 1) score += (strDiff - 1) * 5;
          }

          if (!best || score < best.score) {

          }
        }

      return best;
    };

    // 添付ファイル（arpeggio solo etude.html）と同じピアノボイシング伴奏生成
    const getPianoVoicing = (chord, keySig, accRef) => {
      const rPc = chord.rootPc;
      const thirdPc = rPc + (chord.isMinor || chord.isDim ? 3 : 4);
      const seventhPc = rPc + (chord.isMajor ? 11 : 10);

    // ============ 7ポジション・システム（本吉大我氏） ============
    // 7音スケールを、6弦の開始音（スケールの何音目から始めるか）で7つのポジションに分ける。
    // 各弦3音ずつ順に上がり、2弦だけは3弦の最後の音をもう一度弾いてから始める（だいたい5フレットの範囲に収まる）。
    // メジャー系はイオニアン〜ロクリアンの7つ（ナチュラルマイナーはエオリアン・ポジションとして区別しない）
    const POS_FAMS = {
      MAJ: { pcs: [0, 2, 4, 5, 7, 9, 11], names: ["Ion", "Dor", "Phr", "Lyd", "Mix", "Aeo", "Loc"],
        full: ["Ionian", "Dorian", "Phrygian", "Lydian", "Mixolydian", "Aeolian", "Locrian"], label: "メジャー" },
      MM: { pcs: [0, 2, 3, 5, 7, 9, 11], names: ["MM", "Dor♭2", "Lyd♯5", "Lyd♭7", "Mix♭13", "Aeo♭5", "Alt"],
        full: ["Melodic minor", "Dorian ♭2", "Lydian ♯5", "Lydian ♭7", "Mixolydian ♭13", "Aeolian ♭5", "Altered"], label: "メロディックマイナー" },
      HM: { pcs: [0, 2, 3, 5, 7, 8, 11], names: ["HM", "Loc♮6", "Ion♯5", "Dor♯4", "PhrD", "Lyd♯2", "Alt♭♭7"],
        full: ["Harmonic minor", "Locrian ♮6", "Ionian ♯5", "Dorian ♯4", "Phrygian dominant", "Lydian ♯2", "Altered ♭♭7"], label: "ハーモニックマイナー" }
    };
    const _posCache = {};
    const sevenPositions = (par) => {
      const key = par.fam + par.root;
      if (_posCache[key]) return _posCache[key];
      const fam = POS_FAMS[par.fam], out = [];
      const ladder = []; for (let m = 28; m <= 100; m++) if (fam.pcs.includes(((m - par.root) % 12 + 12) % 12)) ladder.push(m);
      for (let k = 0; k < 7; k++) {
        const startPc = (par.root + fam.pcs[k]) % 12;

    };
    // コードから「どのスケールのポジションで弾くか」（親スケール）を決める。前と同じ親スケールで済むならそれを続ける
    const chordParent = (name, prevName, nextName, prevParent) => {

    };
    // 曲全体のコード進行から、小節（前半・後半）ごとの親スケールを決める
    const planParents = (chordBars) => {

      chordBars.forEach((bar, bi) => String(bar || "").split(/\s+/).filter(Boolean).forEach((nm, h) => flat.push({ bi, h, nm })));
